<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenhouse Expansion Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-title">Greenhouse Expansion Planner</div>
    <div style="display:flex;align-items:baseline;gap:14px">
      <div style="display:flex;gap:12px;font-size:10px" id="nav"></div>
      <div style="font-size:10px">v {{VERSION}}</div>
      <button onclick="toggleTheme()" class="btn" id="themeToggle">light</button>
    </div>
  </div>
</div>
<script src="utils.js"></script>
<script>document.getElementById('nav').innerHTML = buildNav('index.html'); initTheme();</script>

<div class="gantt-wrapper">
  <div class="panel" id="ganttPanel"></div>
</div>

<div class="layout">
  <!-- SIDEBAR -->
  <div id="sidebar"></div>

  <!-- MAIN -->
  <div style="min-width:0">
    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="panel">
      <div class="panel-title" style="cursor:pointer" onclick="document.getElementById('revExpBody').style.display=document.getElementById('revExpBody').style.display==='none'?'':'none'">Revenue & Expense ($M) <span style="font-size:8px;color:var(--text-dim)">▼</span></div>
      <div id="revExpBody"><div style="overflow-x:auto"><table class="fin-table" id="revExpTable"></table></div></div>
    </div>

    <div class="panel">
      <div class="panel-title" style="cursor:pointer" onclick="document.getElementById('ownershipBody').style.display=document.getElementById('ownershipBody').style.display==='none'?'':'none'">Ownership <span style="font-size:8px;color:var(--text-dim)">▼</span></div>
      <div id="ownershipBody">
        <div style="overflow-x:auto"><table class="fin-table" id="ownershipTable"></table></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title" style="cursor:pointer" onclick="document.getElementById('distBody').style.display=document.getElementById('distBody').style.display==='none'?'':'none'">Distributions ($M) <span style="font-size:8px;color:var(--text-dim)">▼</span></div>
      <div id="distBody">
        <div style="font-size:10px;color:var(--text-muted);margin:4px 0 2px">Waterfall — No Expansion</div>
        <div style="overflow-x:auto"><table class="fin-table" id="distTableNoExp"></table></div>
        <div style="font-size:10px;color:var(--text-muted);margin:12px 0 2px">Waterfall — With Expansion</div>
        <div style="overflow-x:auto"><table class="fin-table" id="distTable"></table></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title" style="cursor:pointer" onclick="document.getElementById('partnerBody').style.display=document.getElementById('partnerBody').style.display==='none'?'':'none'">Partner Cash ($M) <span style="font-size:8px;color:var(--text-dim)">▼</span></div>
      <div id="partnerBody">
        <div style="overflow-x:auto"><table class="fin-table" id="partnerTable"></table></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title" style="cursor:pointer" onclick="document.getElementById('taxBody').style.display=document.getElementById('taxBody').style.display==='none'?'':'none'">Taxable Income ($M) <span style="font-size:8px;color:var(--text-dim)">▼</span></div>
      <div id="taxBody" style="display:none"><div style="overflow-x:auto"><table class="fin-table" id="taxTable"></table></div></div>
    </div>

    <div class="panel">
      <div class="panel-title">Cash Flow & Stake Value Summary ($M)</div>
      <div style="overflow-x:auto"><table class="fin-table" id="scenSummaryTable"></table></div>
    </div>

    <div class="panel">
      <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Scenario Comparison ($M)</span>
        <label style="font-size:10px;color:var(--text-sub);font-weight:normal;cursor:pointer">
          <input type="checkbox" id="scenShowTaxToggle" checked
            onchange="_scenShowTax=this.checked; if(lastData) renderScenarioComparison(lastData, lastData.years);">
          include tax distributions
        </label>
      </div>
      <div style="overflow-x:auto"><table class="fin-table" id="scenComparisonTable"></table></div>
    </div>

  </div>
</div>

<script>
// ============================================================
// ZERO MATH — display only. All computation via /api/compute.
// ============================================================

const PARTNERS = ['EB', 'JS', 'JJB'];

let settings = {};
let lastData = null;

// --- API ---
async function loadSettings() {
  const r = await fetch('/api/settings');
  settings = await r.json();
}

async function compute(partial) {
  if (partial) Object.assign(settings, partial);
  _scenCache = null;  // settings changed → refetch scenario comparison
  const r = await fetch('/api/compute', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(settings),
  });
  lastData = await r.json();
  render(lastData);
}

function updateSetting(key, value) {
  settings[key] = value;
  compute({[key]: value});
}

function setExpansionStart(q) {
  // q encoded as 20271 etc. Updates K/J/E/PACK start quarters in one go.
  compute({kStartQ: q, jStartQ: q, eStartQ: q, packStartQ: q});
}

function setBuildMonths(m) {
  compute({kBuildMonths: m, jBuildMonths: m, eBuildMonths: m, packBuildMonths: m});
}

function setLender(name) {
  const presets = { SBA: {ltv:20, term:25, rate:7}, JJB: {ltv:15, term:5, rate:9} };
  const p = presets[name];
  if (!p) return;
  compute({
    expansionLender: name,
    financingPct: 100 - p.ltv,
    bankTerm: p.term,
    bankRate: p.rate,
    sbicCap: 0,            // single-tranche
    bankLoanCap: 1e9,      // disabled
  });
}

// --- BUILD PRESETS ---
const BUILD_PRESETS = {
  'NONE':   {label:'No Expansion',    newKAcres:0,   newJAcres:0,   newEAcres:0,   packhouseAcres:0,    packhouseCostPerAc:4000000, housingPods:0},
  '3-NO':   {label:'3 blk · No PH',   newKAcres:1.4, newJAcres:1.4, newEAcres:1.4, packhouseAcres:0,    packhouseCostPerAc:4000000, housingPods:2},
  '3-SHED': {label:'3 blk · Shed',    newKAcres:1.4, newJAcres:1.4, newEAcres:1.4, packhouseAcres:0.25, packhouseCostPerAc:4000000, housingPods:2},
  '3-FULL': {label:'3 blk · Full PH', newKAcres:1.4, newJAcres:1.4, newEAcres:1.4, packhouseAcres:0.5,  packhouseCostPerAc:4000000, housingPods:2},
  '4-NO':   {label:'4 blk · No PH',   newKAcres:1.4, newJAcres:1.4, newEAcres:2.8, packhouseAcres:0,    packhouseCostPerAc:4000000, housingPods:2},
  '4-SHED': {label:'4 blk · Shed',    newKAcres:1.4, newJAcres:1.4, newEAcres:2.8, packhouseAcres:0.25, packhouseCostPerAc:4000000, housingPods:2},
  '4-FULL': {label:'4 blk · Full PH', newKAcres:1.4, newJAcres:1.4, newEAcres:2.8, packhouseAcres:0.5,  packhouseCostPerAc:4000000, housingPods:2},
};
let activePreset = null;
function detectActivePreset() {
  const eq = (a, b) => Math.abs((a || 0) - (b || 0)) < 0.05;
  for (const [id, p] of Object.entries(BUILD_PRESETS)) {
    if (eq(settings.newKAcres, p.newKAcres) &&
        eq(settings.newJAcres, p.newJAcres) &&
        eq(settings.newEAcres, p.newEAcres) &&
        eq(settings.newLAcres, 0) &&
        eq(settings.newTAcres, 0) &&
        eq(settings.packhouseAcres, p.packhouseAcres) &&
        eq(settings.housingPods, p.housingPods)) {
      return id;
    }
  }
  return null;
}
function loadBuildPreset(id) {
  const p = BUILD_PRESETS[id];
  if (!p) return;
  activePreset = id;
  compute({
    newKAcres: p.newKAcres, newJAcres: p.newJAcres, newEAcres: p.newEAcres,
    newLAcres: 0, newTAcres: 0,
    packhouseAcres: p.packhouseAcres, packhouseCostPerAc: p.packhouseCostPerAc,
    housingPods: p.housingPods,
    debug: false,
  });
}

// --- BUILD SIDEBAR ---
function buildSidebar() {
  const S = (k, o) => makeSlider(k, o);
  let h = '';
  const presetBtn = (id) => {
    const p = BUILD_PRESETS[id];
    const active = activePreset === id;
    const style = active ? 'background:var(--accent);color:#000' : '';
    return `<button class="btn" style="${style};font-size:9px;padding:3px 4px" onclick="loadBuildPreset('${id}')">${p.label}</button>`;
  };
  h += `<div class="panel" style="position:sticky;top:60px;z-index:20;background:var(--panel)"><div class="panel-title">Build Preset</div>
    <div style="display:grid;grid-template-columns:1fr;gap:4px;margin-bottom:4px">${presetBtn('NONE')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px">
      ${presetBtn('3-NO')}${presetBtn('3-SHED')}${presetBtn('3-FULL')}
      ${presetBtn('4-NO')}${presetBtn('4-SHED')}${presetBtn('4-FULL')}
    </div>
    <div style="font-size:9px;color:var(--text-dim);margin-top:6px;line-height:1.3">
      60k sqft blocks (1K · 1J · ${activePreset && activePreset.startsWith('4') ? '2E' : '1E'}). Lettuce/tomato zeroed.
    </div>
  </div>`;

  // Expansion timing — global start quarter + construction months
  const curStartQ = settings.kStartQ || 20271;
  const curBuildMonths = settings.kBuildMonths || 12;
  const qLabel = (q) => `Q${q%10}'${String(Math.floor(q/10)).slice(2)}`;
  const startOpts = [];
  for (let y = 2026; y <= 2028; y++) for (let q = 1; q <= 4; q++) {
    const v = y*10 + q;
    startOpts.push(`<option value="${v}" ${v===curStartQ?'selected':''}>${qLabel(v)}</option>`);
  }
  const monthOpts = [];
  for (let m = 12; m <= 18; m++) {
    monthOpts.push(`<option value="${m}" ${m===curBuildMonths?'selected':''}>${m} mo</option>`);
  }
  h += `<div class="panel"><div class="panel-title">Expansion Timing</div>
    <div style="font-size:9px;color:var(--text-dim);margin-bottom:3px">START QUARTER</div>
    <select class="btn" style="width:100%;font-size:10px;padding:3px 6px;margin-bottom:8px" onchange="setExpansionStart(Number(this.value))">${startOpts.join('')}</select>
    <div style="font-size:9px;color:var(--text-dim);margin-bottom:3px">CONSTRUCTION MONTHS</div>
    <select class="btn" style="width:100%;font-size:10px;padding:3px 6px" onchange="setBuildMonths(Number(this.value))">${monthOpts.join('')}</select>
  </div>`;

  h += `<div class="panel"><div class="panel-title">Revenue Adjustments</div>
    ${S('englishPricePerLb', {label:"English '27 $/lb",min:3,max:3.5,step:0.125,def:3,fmt:v=>'$'+v.toFixed(2)})}
  </div>`;

  h += `<div class="panel"><div class="panel-title">Inflation</div>
    ${S('revInflation', {label:'Revenue Escalation',min:3,max:5,step:0.5,def:4,fmt:v=>v.toFixed(1)+'%/yr'})}
    ${S('costInflation', {label:'Cost Escalation',min:3,max:5,step:0.5,def:3,fmt:v=>v.toFixed(1)+'%/yr'})}
  </div>`;

  const FM = v => (v < 0 ? '−' : '') + (Math.abs(v) / 1e6).toFixed(2) + 'M';

  // Expansion Loan — lender (SBA/JJB) + equity %. Term & rate derived from lender.
  const curLender = settings.expansionLender || 'SBA';
  const curLtv = 100 - (settings.financingPct || 80);  // here LTV = equity %
  const lenderTerms = { SBA: '25 yr · 7%', JJB: '5 yr · 9%' };
  const tBtn = (label, isActive, onclick) =>
    `<button class="btn" style="${isActive?'background:var(--accent);color:#000;':''}font-size:10px;padding:3px 8px;flex:1" onclick="${onclick}">${label}</button>`;
  h += `<div class="panel"><div class="panel-title">Expansion Loan</div>
    <div style="font-size:9px;color:var(--text-dim);margin-bottom:3px">LENDER</div>
    <div style="display:flex;gap:4px;margin-bottom:4px">
      ${tBtn('SBA', curLender==='SBA', "setLender('SBA')")}
      ${tBtn('JJB', curLender==='JJB', "setLender('JJB')")}
    </div>
    <div style="font-size:10px;color:var(--text-sub);margin-bottom:8px">→ ${lenderTerms[curLender]}</div>
    <div style="font-size:9px;color:var(--text-dim);margin-bottom:3px">EQUITY %</div>
    <div style="display:flex;gap:4px">
      ${tBtn('15%', curLtv===15, "updateSetting('financingPct',85)")}
      ${tBtn('20%', curLtv===20, "updateSetting('financingPct',80)")}
    </div>
  </div>`;

  // Compute derived net% for display under the slider
  const _jjbCap = (lastData && lastData.jjb_equity) || 0;
  const _val = settings.jjbBuyinValuation || 15000000;
  const _rawNet = _val > 0 ? _jjbCap / (2 * _val) : 0;
  const _netPct = Math.round(_rawNet / 0.0025) * 0.0025 * 100;
  h += `<div class="panel"><div class="panel-title">Equity Valuations</div>
    ${S('jjbBuyinValuation', {label:'JJB Buy-in Valuation',min:5000000,max:25000000,step:1000000,def:15000000,fmt:FM})}
    <div style="font-size:9px;color:var(--text-dim);margin-top:-4px;line-height:1.4">
      → JJB net: ${_netPct.toFixed(2)}% · gross: ${(2*_netPct).toFixed(2)}% (JJB$ ${(_jjbCap/1e6).toFixed(2)}M)
    </div>
  </div>`;

  h += `<div class="panel"><div class="panel-title">EB Promote (from JS & JJB)</div>
    ${S('ebExpansionGrantPct', {label:'Annual %',min:0,max:1,step:0.25,def:0.5,fmt:v=>v.toFixed(2)+'%'})}
    ${S('ebExpansionGrantStartYear', {label:'Start Year',min:2026,max:2032,step:1,def:2027,fmt:v=>''+v})}
    ${S('ebExpansionGrantEndYear', {label:'End Year',min:2028,max:2035,step:1,def:2035,fmt:v=>''+v})}
  </div>`;

  document.getElementById('sidebar').innerHTML = h;
}

// --- GANTT CHART ---
const GANTT_COLS = 28;        // 7 years × 4 quarters (2027–2033)
const HIDDEN_GANTT_KEYS = new Set(['T', 'T_BUY', 'L', 'LAND']);

const NEW_OPTIONS = {
  K:  {key:'newKAcres'},
  J:  {key:'newJAcres'},
  E:  {key:'newEAcres'},
  PACK:  {key:'packhouseAcres'},
  HOUSE: {key:'housingPods'},
};
const MARGIN_OPTIONS = {
  K:  {key:'keikiMrgnPct'},
  J:  {key:'japaneseMrgnPct'},
  E:  {key:'englishMrgnPct'},
};
const COST_OPTIONS = {
  K:  {key:'cucumberCostPerAc'},
  J:  {key:'cucumberCostPerAc'},
  E:  {key:'cucumberCostPerAc'},
  PACK:  {key:'packhouseCostPerAc'},
  HOUSE: {key:'housingCostPerPod'},
};

const Q_OPTIONS = [];
for (let y = 2026; y <= 2033; y++) for (let q = 1; q <= 4; q++) Q_OPTIONS.push({val: y*10+q, label: `Q${q}'${String(y).slice(2)}`});

function qToCol(q) { return (Math.floor(q / 10) - 2027) * 4 + (q % 10) - 1; }
function fRevAc(v) { return (v/1e6).toFixed(2); }

function renderGantt(d) {
  const gd = d.gantt_data || [];
  if (!gd.length) { document.getElementById('ganttPanel').innerHTML = ''; return; }

  // Year headers
  const years = [];
  for (let y = 2027; y <= 2033; y++) years.push(y);
  let yearHdr = years.map(y => `<div class="gantt-year" style="grid-column:span 4">'${String(y).slice(2)}</div>`).join('');

  // Quarter gridlines
  let qLines = '';
  for (let i = 0; i < GANTT_COLS; i++) {
    const isYearBound = i % 4 === 0;
    qLines += `<div class="gantt-q-line" style="grid-column:${i+1};border-left:1px solid ${isYearBound ? 'var(--border)' : 'rgba(255,255,255,0.04)'}"></div>`;
  }

  const irrMap = {};
  for (const ci of (d.crop_irrs || [])) irrMap[ci.key] = ci;

  const totals = {old: 0, new: 0, cost: 0};
  let rows = '';
  for (const item of gd) {
    const isInfra = item.is_infra;
    const key = item.key;
    if (HIDDEN_GANTT_KEYS.has(key)) continue;
    if (item.is_buy) continue;
    const lk = key.toLowerCase();

    const labelHtml = `<div class="gantt-crop-name">${item.label}</div>`;

    // Old units
    const oldHtml = isInfra
      ? `<div class="gantt-cell-muted gantt-right">–</div>`
      : `<div class="gantt-cell gantt-right">${item.acres_existing > 0 ? item.acres_existing.toFixed(1) : '–'}</div>`;

    // +New input
    let newHtml = '';
    const no = NEW_OPTIONS[key];
    if (no) {
      const curVal = isInfra ? (item.units_new || 0) : (item.acres_new || 0);
      newHtml = `<div class="gantt-cell gantt-right"><input type="number" class="gantt-input gantt-ctrl" value="${curVal}" min="0" step="any" data-key="${no.key}"></div>`;
    }

    // Total
    const newVal = isInfra ? (item.units_new || 0) : (item.acres_new || 0);
    let totalHtml;
    if (isInfra) {
      const fmtVal = (key === 'PACK') ? newVal.toFixed(1) : newVal;
      totalHtml = `<div class="gantt-cell gantt-right">${newVal > 0 ? fmtVal : '–'}</div>`;
    } else {
      const total = (item.acres_existing || 0) + (item.acres_new || 0);
      totalHtml = `<div class="gantt-cell gantt-right">${total > 0 ? total.toFixed(1) : '–'}</div>`;
    }

    // Rev/Ac
    const revHtml = isInfra
      ? `<div class="gantt-cell-muted gantt-right">–</div>`
      : `<div class="gantt-cell gantt-right">${fRevAc(item.rev_per_ac || 0)}</div>`;

    // Margin% input
    const mo = MARGIN_OPTIONS[key];
    const marginHtml = mo
      ? `<div class="gantt-cell gantt-right"><input type="number" class="gantt-input gantt-ctrl" value="${100 - settings[mo.key]}" min="0" max="100" step="any" data-key="${mo.key}" data-invert="1"></div>`
      : `<div class="gantt-cell-muted">–</div>`;

    // Cost/Ac input
    const co = COST_OPTIONS[key];
    const costHtml = co
      ? `<div class="gantt-cell gantt-right"><input type="number" class="gantt-input gantt-ctrl" value="${((settings[co.key] || 0)/1e6).toFixed(2)}" min="0" step="any" data-key="${co.key}" data-scale="1e6"></div>`
      : '';

    // Cost total
    const costPerUnit = co ? (settings[co.key] || 0) : 0;
    const totalCost = newVal * costPerUnit;
    const costTotalHtml = totalCost > 0
      ? `<div class="gantt-cell gantt-right">${(totalCost/1e6).toFixed(1)}</div>`
      : `<div class="gantt-cell-muted gantt-right">–</div>`;

    // Accumulate totals
    if (!isInfra) {
      totals.old += item.acres_existing || 0;
      totals.new += item.acres_new || 0;
    }
    totals.cost += newVal * costPerUnit;

// Ramp (crops only)
    let rampHtml;
    if (!isInfra) {
      const rampKey = lk + 'RampYears';
      const curRamp = settings[rampKey];
      const rOpts = [0,1,2,3,4].map(v => `<option value="${v}" ${v===curRamp?'selected':''}>${v}yr</option>`).join('');
      rampHtml = `<div class="gantt-cell"><select class="gantt-select gantt-ctrl" data-key="${rampKey}">${rOpts}</select></div>`;
    } else {
      rampHtml = `<div class="gantt-cell-muted">–</div>`;
    }

    // Timeline bars. end_q = last build quarter; production starts end_q + 1.
    const startCol = qToCol(item.start_q);
    const endCol = qToCol(item.end_q);
    const buildW = endCol - startCol + 1;  // inclusive of end_q
    const firstProdCol = endCol + 1;       // production starts here
    const rampW = (item.ramp_years || 0) * 4;
    const prodStart = firstProdCol + rampW;
    const prodW = GANTT_COLS - prodStart;

    let barsHtml = `<div class="gantt-timeline">${qLines}`;
    if (buildW > 0) {
      barsHtml += `<div class="gantt-bar gantt-bar-build" style="grid-column:${startCol+1}/span ${buildW}" title="Build: ${Q_OPTIONS.find(o=>o.val===item.start_q)?.label||''} → ${Q_OPTIONS.find(o=>o.val===item.end_q)?.label||''} (production starts next quarter)"></div>`;
    }
    if (rampW > 0 && !isInfra) {
      barsHtml += `<div class="gantt-bar gantt-bar-ramp" style="grid-column:${firstProdCol+1}/span ${rampW}"></div>`;
    }
    if (prodW > 0 && !isInfra) {
      barsHtml += `<div class="gantt-bar gantt-bar-prod" style="grid-column:${prodStart+1}/span ${Math.max(1, prodW)}"></div>`;
    }
    barsHtml += '</div>';

    const rowHtml = `<div class="gantt-row" data-key="${key}">
      <div class="gantt-label">${labelHtml}</div>
      ${oldHtml}${newHtml}${totalHtml}
      ${revHtml}${marginHtml}${costHtml}${costTotalHtml}
      ${rampHtml}
      <div></div>${barsHtml}
    </div>`;

    // Hide rows with zero acres/units (except PACK which always shows)
    if (isInfra) {
      if (newVal > 0 || key === 'PACK') rows += rowHtml;
    } else {
      if ((item.acres_existing || 0) + (item.acres_new || 0) > 0) rows += rowHtml;
    }
  }

  const hL = 'font-size:9px;color:var(--text-muted);text-align:left;padding:0 2px';
  const hR = 'font-size:9px;color:var(--text-muted);text-align:right;padding:0 2px';
  const hC = 'font-size:9px;color:var(--text-muted);text-align:center;padding:0 2px';
  const hSpan = 'font-size:8px;color:var(--text-dim);text-align:center;border-bottom:1px solid var(--border);padding:0 0 2px;margin:0 4px';
  document.getElementById('ganttPanel').innerHTML = `
    <div class="panel-title">Expansion Phasing</div>
    <div class="gantt-container">
      <div class="gantt-header" style="border-bottom:none;padding-bottom:0;margin-bottom:0">
        <div></div>
        <div style="${hSpan};grid-column:2/5">(acres)</div>
        <div style="${hSpan};grid-column:5/9">($M)</div>
        <div style="grid-column:9/10"></div>
        <div></div><div></div>
      </div>
      <div class="gantt-header">
        <div class="gantt-label" style="${hL}">Item</div>
        <div style="${hR}">Old</div>
        <div style="${hC}">New</div>
        <div style="${hR}">Total</div>
        <div style="${hR}">Rev/Ac</div>
        <div style="${hC}">Mrgn</div>
        <div style="${hC}">Cost/Ac</div>
        <div style="${hR}">Cost</div>
        <div style="${hC};cursor:help" title="Production ramp — linear from 0% to 100% over (ramp_years × 4) quarters.&#10;Q_n = production quarter (1-indexed from first prod quarter).&#10;ramp = min(100%, Q_n / (ramp_years × 4))&#10;&#10;1-yr: Q1=25% Q2=50% Q3=75% Q4=100%&#10;2-yr: Q1=12.5% Q4=50% Q8=100%&#10;4-yr: Q1=6.25% Q8=50% Q16=100%">Ramp <span style="color:var(--text-dim)">ⓘ</span></div>
        <div></div><div class="gantt-timeline-header">${yearHdr}</div>
      </div>
      ${rows}
      <div class="gantt-row" style="border-top:1px solid var(--border);font-weight:700">
        <div class="gantt-label"><div class="gantt-crop-name" style="font-weight:700;color:var(--text)">Total</div></div>
        <div class="gantt-cell gantt-right" style="color:var(--text)">${totals.old.toFixed(1)}</div>
        <div class="gantt-cell gantt-right" style="color:var(--text)">${totals.new.toFixed(1)}</div>
        <div class="gantt-cell gantt-right" style="color:var(--text)">${(totals.old + totals.new).toFixed(1)}</div>
        <div class="gantt-cell">–</div>
        <div class="gantt-cell">–</div>
        <div class="gantt-cell">–</div>
        <div class="gantt-cell gantt-right" style="color:var(--text)">${(totals.cost/1e6).toFixed(1)}</div>
        <div class="gantt-cell"></div><div></div><div></div>
      </div>
    </div>`;

  document.querySelectorAll('.gantt-ctrl').forEach(el => {
    el.onchange = () => {
      let val = Number(el.value);
      if (el.dataset.invert) val = 100 - val;
      if (el.dataset.scale) val *= Number(el.dataset.scale);
      updateSetting(el.dataset.key, val);
    };
  });
}

// --- RENDER ALL ---
function render(d) {
  const sb = document.getElementById('sidebar');
  const sbScroll = sb ? sb.scrollTop : 0;
  buildSidebar();
  if (sb) sb.scrollTop = sbScroll;
  renderGantt(d);
  const Y = d.years;
  _DN = 2;  // hide last N years from tables

  // KPIs
  const lastIdx = Y.length - 1 - _DN;
  const steadyRev = d.rev[lastIdx], steadyExp = d.exp[lastIdx];
  const steadyOpInc = steadyRev - steadyExp;
  const capex = d.total_capex + d.shared_capex;
  const startupCap = d.startup_capital || 0;
  const bridgeLoan = d.partners_no_exp ? (d.partners_no_exp.guarantee_total || 0) : 0;
  const totalUses = capex + startupCap;
  const bankTotal = d.bank_total || 0;
  const jjbEquity = d.jjb_equity || 0;
  const totalSources = bankTotal + jjbEquity;
  const combinedDS = d.loan_total_ds.map((v, i) => v + d.expansion_ds[i]);
  // Peak across visible years (exclude trimmed tail)
  const visibleDS = combinedDS.slice(0, lastIdx + 1);
  const peakDebt = Math.max(...visibleDS);
  const peakYearIdx = visibleDS.indexOf(peakDebt);
  const peakYear = Y[peakYearIdx];
  const lastDebt = combinedDS[lastIdx];
  // JJB equity contribution = capex-gap + startup capital (both funded by JJB)
  const jjbTotal = jjbEquity + startupCap;
  const totalSourcesFull = bankTotal + jjbTotal;
  document.getElementById('kpiGrid').innerHTML = [
    ['$ Uses', fK(totalUses), `crop: ${fK(d.total_capex)}<br>infra: ${fK(d.shared_capex)}${startupCap > 0 ? '<br>startup: ' + fK(startupCap) : ''}`],
    ['$ Sources', fK(totalSourcesFull), `bank: ${fK(bankTotal)}<br>JJB eq: ${fK(jjbTotal)}${bridgeLoan > 0 ? '<br>bridge: ' + fK(bridgeLoan) : ''}`],
    ['Steady Rev', fK(steadyRev), `year ${Y[lastIdx]}`],
    ['Steady Op Inc', fK(steadyOpInc), `${((steadyOpInc / steadyRev * 100) || 0).toFixed(1)}% margin`],
    ['Debt Svc', fK(peakDebt), `peak in '${String(peakYear).slice(2)}<br>${fK(lastDebt)} in '${String(Y[lastIdx]).slice(2)}`],
  ].map(([l, v, s]) => `<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div><div class="kpi-sub">${s}</div></div>`).join('');

  // Revenue / Expense table
  let rt = `<thead><tr><th></th>${yh(Y)}</tr></thead><tbody>`;
  if (d.total_acres) {
    rt += `<tr><td style="color:var(--text-muted)">Total GH Acres</td>${sl(d.total_acres).map(v => `<td>${Math.round(v)}</td>`).join('')}</tr>`;
  }
  rt += sr('Revenue', Y);
  if (d.rev_rows) {
    const existRows = d.rev_rows.filter(([k]) => k.startsWith('Existing'));
    const newRows = d.rev_rows.filter(([k]) => !k.startsWith('Existing') && !/Tomato|Lettuce/.test(k));
    const sumRows = (rows) => Y.map((_, i) => rows.reduce((s, [, data]) => s + (data[i] || 0), 0));
    const toggleSumRow = (label, sumData, cls) => {
      const lbl = `${label} <span style="font-size:8px;color:var(--text-dim)">▼</span>`;
      return `<tr class="subtotal-row" style="cursor:pointer" onclick="document.querySelectorAll('.${cls}').forEach(r=>r.style.display=r.style.display==='none'?'':'none')"><td>${lbl}</td>${sl(sumData).map(v => `<td>${fCM(v)}</td>`).join('')}</tr>`;
    };
    if (existRows.length) {
      for (const [name, data] of existRows) rt += tr(name, data, fCM, 'rev-exist-detail" style="display:none');
      rt += toggleSumRow('Existing Revenue', sumRows(existRows), 'rev-exist-detail');
    }
    if (newRows.length) {
      for (const [name, data] of newRows) rt += tr(name, data, fCM, 'rev-new-detail" style="display:none');
      rt += toggleSumRow('New Revenue', sumRows(newRows), 'rev-new-detail');
    }
  }
  rt += tr('Total Revenue', d.rev, fCM, 'subtotal-row');
  rt += `<tr class="section-header" style="cursor:pointer" onclick="document.querySelectorAll('.exp-detail').forEach(r=>r.style.display=r.style.display==='none'?'':'none')"><td colspan="${Y.length - _DN + 1}">Expenses</td></tr>`;
  if (d.exp_rows) {
    for (const [name, data] of d.exp_rows) rt += tr(name, data.map(v => -v), fCM, 'exp-detail');
  }
  rt += tr('Total Expenses', d.exp.map(v => -v), fCM, 'subtotal-row');
  rt += tr('Operating Income', d.op_inc, fCM, 'total-row-table');
  const opMargin = d.op_inc.map((v, i) => d.rev[i] > 0 ? (v / d.rev[i] * 100) : 0);
  rt += `<tr><td>Op Margin</td>${sl(opMargin).map(v => `<td>${Math.round(v)}%</td>`).join('')}</tr>`;
  if (d.loan_data && d.expansion_loan_detail) {
    const totalDebt = Y.map((_, i) => {
      let bal = 0;
      for (const sched of Object.values(d.loan_data)) bal += sched[i].end_bal;
      for (const [name, det] of Object.entries(d.expansion_loan_detail)) {
        if (name.includes('(Buy)')) continue;
        bal += (det.balance[i] || 0);
      }
      return bal;
    });
    rt += `<tr><td><a href="debt.html" style="color:inherit;text-decoration:underline dotted">Total Debt</a></td>${sl(totalDebt).map(v => `<td>${fCM(v)}</td>`).join('')}</tr>`;
  }
  rt += '</tbody>';
  document.getElementById('revExpTable').innerHTML = rt;

  // Ownership table (summary + collapsible detail)
  let ot = `<thead><tr><th></th>${yh(Y)}</tr></thead><tbody>`;
  if (d.ownership_detail) {
    const capRow = d.ownership_detail.find(r => r[0].includes('Capital'));
    if (capRow) {
      const vals = _DN ? capRow.slice(1, -_DN) : capRow.slice(1);
      ot += `<tr><td>JJB Equity In</td>${vals.map(v => `<td>${v > 0 ? fCM(v) : '—'}</td>`).join('')}</tr>`;
    }
  }
  for (const p of PARTNERS) {
    ot += `<tr><td>${p}</td>${sl(d.ownership).map(o => `<td style="text-align:right">${(o[p] || 0).toFixed(1)}</td>`).join('')}</tr>`;
  }
  if (d.ownership_detail) {
    ot += `<tr><td colspan="${Y.length-_DN+1}" style="padding-top:4px">
      <a href="#" onclick="document.getElementById('ownershipDetail').style.display=document.getElementById('ownershipDetail').style.display==='none'?'':'none';return false"
         style="color:var(--accent);font-size:9px;text-decoration:none">show/hide detail</a></td></tr>`;
    ot += `</tbody><tbody id="ownershipDetail" style="display:none">`;
    ot += `<tr><td colspan="${Y.length-_DN+1}" style="color:var(--text-sub);font-size:10px;padding-top:6px">EB PEDD grant: +${d.pedd_grant.toFixed(1)} (PE/DD repaid: ${fK(d.cum_pedd)})</td></tr>`;

    const lookup = {};
    for (const row of d.ownership_detail) lookup[row[0]] = row.slice(1);
    const yLen = (lookup['Starting EB %'] || Y).length;
    const zeros = Array(yLen).fill(0);
    const neg = arr => (arr || zeros).map(v => -v);

    // EB grant dilution on JS & JJB matches backend: PEDD 50/50; Promote pro-rata to current JS:JJB
    const pedd     = lookup['EB grant (PEDD)']  || zeros;
    const promote  = lookup['EB promote']       || zeros;
    const startJJB = lookup['Starting JJB %']   || zeros;
    const startJS  = lookup['Starting JS %']    || zeros;
    const buyJS    = lookup['JJB buys from JS'] || zeros;
    const ebGrantJS = pedd.map((v, i) => {
      const remain = (startJS[i] || 0) + (startJJB[i] || 0);
      const share = remain > 0 ? (startJS[i] || 0) / remain : 0.5;
      return -(v * 0.5) - (promote[i] || 0) * share;
    });
    const ebGrantJJB = pedd.map((v, i) => {
      const remain = (startJS[i] || 0) + (startJJB[i] || 0);
      const share = remain > 0 ? (startJJB[i] || 0) / remain : 0.5;
      return -(v * 0.5) - (promote[i] || 0) * share;
    });

    // Expansion row — JJB Equity Issued % is the net%, split JJB +net / EB -0.55×net / JS -0.45×net
    const equityIssued = lookup['JJB Equity Issued %'] || zeros;
    const denoise = v => Math.abs(v) < 0.05 ? 0 : v;
    const expEB  = equityIssued.map(v => denoise(-v * 0.55));
    const expJS  = equityIssued.map(v => denoise(-v * 0.45));
    const expJJB = equityIssued.map(v => denoise(v));

    const sections = {
      EB: [
        ['Starting',  lookup['Starting EB %']],
        ['EB grant',  lookup['EB grant (PEDD)']],
        ['Promote',   lookup['EB promote']],
        ['Expansion', expEB],
        ['Ending',    lookup['Ending EB %']],
      ],
      JS: [
        ['Starting',  lookup['Starting JS %']],
        ['EB grant',  ebGrantJS],
        ['JJB sale',  neg(buyJS)],
        ['Expansion', expJS],
        ['Ending',    lookup['Ending JS %']],
      ],
      JJB: [
        ['Starting',  lookup['Starting JJB %']],
        ['EB grant',  ebGrantJJB],
        ['JS buy',    buyJS],
        ['Expansion', expJJB],
        ['Ending',    lookup['Ending JJB %']],
      ],
    };

    const numCol = (v) => `<td style="text-align:right">${typeof v === 'number' ? v.toFixed(1) : (v || '0.0')}</td>`;
    for (const p of PARTNERS) {
      ot += `<tr class="section-header"><td colspan="${Y.length-_DN+1}">${p}</td></tr>`;
      for (const [label, vals] of sections[p]) {
        const arr = vals || zeros;
        const rendered = _DN ? arr.slice(0, -_DN) : arr;
        ot += `<tr><td>${label}</td>${rendered.map(numCol).join('')}</tr>`;
      }
    }
  }
  ot += '</tbody>';
  document.getElementById('ownershipTable').innerHTML = ot;

  // Distribution waterfall (with-exp and no-exp side by side)
  const cashTips = Y.map((y, i) => {
    const cd = d.tax_cash_detail[i];
    let t = y + ' TAX CASH DIST\n';
    if (cd.note) { t += cd.note; }
    else if (cd.final_prior !== undefined) {
      t += '4/15: prior final = ' + fK(cd.final_prior) + '\n';
      t += cd.n_quarters + ' x Q est = ' + fK(cd.q_est) + '\n';
      t += 'Total: ' + fK(cd.total);
    } else {
      t += 'Q4 prior est: ' + fK(cd.q4_prior_est) + '\n';
      t += 'Settlement: ' + fK(cd.settlement) + '\n';
      t += 'Q1-Q3 est: ' + fK(cd.cur_est_3q) + '\n';
      t += 'Total: ' + fK(cd.total);
    }
    return t;
  });
  const buildWaterfall = (src, isNoExp) => {
    let t = `<thead><tr><th></th>${yh(Y)}</tr></thead><tbody>`;
    t += tr('Operating Income', src.op_inc, fCM, 'subtotal-row');
    const jsl = src.jjb_startup_line || src.startup_exp;
    if (jsl && jsl.some(v => v > 0)) {
      t += `<tr><td>JJB Startup Capital</td>${sl(jsl).map(v => `<td>${fCM(v)}</td>`).join('')}</tr>`;
    }
    t += `<tr><td>Existing DS</td>${sl(src.loan_total_ds).map(v => `<td>${fCM(-v)}</td>`).join('')}</tr>`;
    if (!isNoExp) t += `<tr><td>Expansion DS</td>${sl(src.expansion_ds).map(v => `<td>${fCM(-v)}</td>`).join('')}</tr>`;
    t += `<tr><td>DSCR</td>${sl(src.op_inc.map((oi, i) => { const ds = src.loan_total_ds[i] + (src.expansion_ds[i] || 0); return ds > 0 ? (oi / ds).toFixed(1) + 'x' : '—'; })).map(v => `<td>${v}</td>`).join('')}</tr>`;
    t += `<tr><td>Capex Reserve</td>${sl(src.capex_res).map(v => `<td>${fCM(-v)}</td>`).join('')}</tr>`;
    t += tr('Distributable Cash', src.distrib_cash, fCM, 'total-row-table');
    t += sr('Waterfall', Y);
    t += tr('Tax', src.tax_cash.map(v => -v), fCM);
    t += tr('Tier 0 (EB)', src.tier0_actual.map(v => -v), fCM);
    t += `<tr><td>Tier 1 (Partners)</td>${sl(src.tier1_actual).map((v, i) => {
      const short = (src.tier1_shortfall[i] || 0) > 50;
      return `<td${short ? ' style="color:var(--yellow)"' : ''}>${fCM(-v)}${short ? ' *' : ''}</td>`;
    }).join('')}</tr>`;
    t += tr('PE/DD Repayment', src.pedd_payments.map(v => -v), fCM);
    t += tr('Tier 2 (Pro-Rata)', src.tier2.map(v => -v), fCM);
    if (src.tier1_shortfall.some(v => v > 50)) t += tr('T1 Shortfall → DD', src.tier1_shortfall.map(v => -v), fCM);
    t += '</tbody>';
    return t;
  };
  document.getElementById('distTable').innerHTML = buildWaterfall(d, false);
  if (d.partners_no_exp && d.partners_no_exp._waterfall) {
    document.getElementById('distTableNoExp').innerHTML = buildWaterfall(d.partners_no_exp._waterfall, true);
  }

  // Partner cash — clickable header collapses detail rows for that partner
  let pt = `<thead><tr><th></th>${yh(Y)}</tr></thead><tbody>`;
  for (const p of PARTNERS) {
    const pd = d.partners[p];
    if (!pd) continue;
    const cls = `pcd-${p}`;
    pt += `<tr class="section-header" style="cursor:pointer" onclick="document.querySelectorAll('.${cls}').forEach(r=>r.style.display=r.style.display==='none'?'':'none')"><td colspan="${Y.length-_DN+1}">${p} <span style="font-size:8px;color:var(--text-dim)">▼</span></td></tr>`;
    pt += tr('Tax Dist', pd.tax_dist, fCM, `${cls}" style="display:none`);
    if (pd.tier_0) pt += tr('Tier 0', pd.tier_0, fCM, `${cls}" style="display:none`);
    pt += tr('Tier 1', pd.tier_1, fCM, `${cls}" style="display:none`);
    if (pd.pedd) pt += tr('PE/DD', pd.pedd, fCM, `${cls}" style="display:none`);
    pt += tr('Tier 2', pd.tier_2, fCM, `${cls}" style="display:none`);
    if (pd.equity_buy_sell) pt += tr('Equity Buy/Sell', pd.equity_buy_sell, fCM, `${cls}" style="display:none`);
    const gt = d.partners_no_exp && d.partners_no_exp.guarantee;
    if (gt && gt[p] && gt[p].balance.some(v => v > 50)) {
      const net = gt[p].advance.map((v, i) => v - gt[p].repay[i]);
      pt += tr('Bridge (net)', net, fCM, `${cls}" style="display:none`);
    }
    pt += tr('Total ' + p, pd.total, fCM, 'subtotal-row');
    if (d.partners_no_exp && d.partners_no_exp[p]) {
      pt += tr('No Expansion', d.partners_no_exp[p], fCM);
      const diff = pd.total.map((v, i) => v - d.partners_no_exp[p][i]);
      pt += tr('Expansion Impact', diff, fCM);
    }
  }
  pt += '</tbody>';
  document.getElementById('partnerTable').innerHTML = pt;

  // Tax detail
  let tx = `<thead><tr><th></th>${yh(Y)}</tr></thead><tbody>`;
  tx += tr('Operating Income', d.op_inc, fCM, 'subtotal-row');
  const totalInt = d.total_interest || d.loan_total_int;
  tx += `<tr><td><a href="debt.html" style="color:inherit;text-decoration:underline dotted">Total Interest</a></td>${sl(totalInt).map(v => `<td>${fCM(-v)}</td>`).join('')}</tr>`;
  tx += tr('Taxable Income', d.taxable_inc, fCM);
  tx += sr('Federal', Y);
  tx += tr('Bonus Depreciation', d.dep.fed.map(v => -v), fCM);
  const fedTaxable = Y.map((_, i) => d.tax_detail[i].fed_taxable);
  tx += tr('Fed Taxable', fedTaxable, fCM, 'subtotal-row');
  tx += tr('EB Share', d.tax_detail.map(td => td.eb_fed), fCM);
  tx += tr('NOL Used', d.tax_detail.map(td => -td.nol_used), fCM);
  tx += tr('NOL Generated', d.tax_detail.map(td => td.nol_generated), fCM);
  tx += tr('NOL Balance', d.tax_detail.map(td => td.nol_remaining), fCM);
  tx += tr('EB Net Taxable', d.tax_detail.map(td => td.eb_net_fed), fCM);
  tx += tr('Fed Tax (EB)', d.tax_detail.map(td => -td.fed_tax), fCM);
  tx += tr('Fed Tax (entity)', d.tax_detail.map(td => -td.fed_dist), fCM);
  tx += sr('Hawaii', Y);
  tx += tr('State Depreciation', d.dep.state.map(v => -v), fCM);
  const hiTaxable = Y.map((_, i) => d.tax_detail[i].hi_taxable);
  tx += tr('HI Taxable', hiTaxable, fCM, 'subtotal-row');
  tx += tr('EB HI Taxable', d.tax_detail.map(td => td.eb_hi), fCM);
  tx += tr('HI Tax (EB)', d.tax_detail.map(td => -td.hi_tax), fCM);
  tx += tr('HI Tax (entity)', d.tax_detail.map(td => -td.hi_dist), fCM);
  tx += sr('Total', Y);
  tx += tr('Tax Liability', d.tax_liab, fCM, 'subtotal-row');
  tx += `<tr class="total-row-table"><td>Tax Cash Dist</td>${sl(d.tax_cash).map((v, i) =>
    `<td title="${cashTips[i].replace(/"/g,'&quot;')}" style="cursor:help">${fCM(-v)}</td>`
  ).join('')}</tr>`;
  tx += '</tbody>';
  document.getElementById('taxTable').innerHTML = tx;

  renderScenarioComparison(d, Y);
}

// --- SCENARIO COMPARISON ---
let RESOLUTION_DATA = null;  // loaded from /api/constants at init
let _scenShowTax = true;

async function fetchScenarioData(overrides) {
  const body = JSON.stringify({...settings, ...overrides});
  const r = await fetch('/api/compute', {method:'POST', headers:{'Content-Type':'application/json'}, body});
  return r.json();
}

let _scenComparisonInflight = false;
let _scenCache = null;
async function renderScenarioComparison(d, Y) {
  if (_scenComparisonInflight) return;
  _scenComparisonInflight = true;
  try {
    const presetOverrides = (id) => {
      const p = BUILD_PRESETS[id];
      return {
        newKAcres: p.newKAcres, newJAcres: p.newJAcres, newEAcres: p.newEAcres,
        newLAcres: 0, newTAcres: 0,
        packhouseAcres: p.packhouseAcres, packhouseCostPerAc: p.packhouseCostPerAc,
        housingPods: p.housingPods,
        debug: false,
      };
    };
    if (!_scenCache) {
      const [d3, d4] = await Promise.all([
        fetchScenarioData(presetOverrides('3-NO')),
        fetchScenarioData(presetOverrides('4-FULL')),
      ]);
      _scenCache = {d3, d4};
    }
    const {d3, d4} = _scenCache;

    const scenarios = [
      {label: 'Resolution',         resolution: true},
      {label: 'No Expansion',       data: d, useNoExp: true},
      {label: '3 blk · No PH',      data: d3},
      {label: '4 blk · Full PH',    data: d4},
    ];

    let st = `<thead><tr><th></th>${yh(Y)}</tr></thead><tbody>`;
    for (const s of scenarios) {
      st += `<tr class="section-header"><td colspan="${Y.length-_DN+1}">${s.label}</td></tr>`;
      const taxKey = _scenShowTax ? 'withTax' : 'noTax';
      if (s.resolution) {
        const displayed = Y.length - _DN;
        const fmt = v => v == null ? '—' : (v / 1e6).toFixed(1);
        const renderRow = (label, vals) => {
          const padded = [...vals];
          while (padded.length < displayed) padded.push(null);
          return `<tr><td>${label}</td>${padded.slice(0, displayed).map(v => `<td>${fmt(v)}</td>`).join('')}</tr>`;
        };
        st += renderRow('EBITDA', RESOLUTION_DATA.EBITDA);
        st += renderRow('EB',     RESOLUTION_DATA.EB[taxKey]);
        st += renderRow('JS',     RESOLUTION_DATA.JS[taxKey]);
        st += renderRow('JJB',    RESOLUTION_DATA.JJB[taxKey]);
      } else {
        const ds = s.data;
        if (s.useNoExp) {
          const ne = ds.partners_no_exp && ds.partners_no_exp._waterfall;
          if (ne) {
            st += tr('Revenue', ne.rev || ds.rev.map(() => 0), fCM);
            st += tr('EBITDA', ne.op_inc, fCM);
          }
          const taxes = (ds.partners_no_exp && ds.partners_no_exp._tax) || {};
          for (const p of PARTNERS) {
            const arr = ds.partners_no_exp && ds.partners_no_exp[p];
            if (!arr) continue;
            const vals = _scenShowTax ? arr : arr.map((v, i) => v - (taxes[p] ? taxes[p][i] : 0));
            st += tr(p, vals, fCM);
          }
        } else {
          st += tr('Revenue', ds.rev, fCM);
          st += tr('EBITDA', ds.op_inc, fCM);
          for (const p of PARTNERS) {
            const pd = ds.partners && ds.partners[p];
            if (!pd) continue;
            const vals = _scenShowTax ? pd.total : pd.total.map((v, i) => v - (pd.tax_dist[i] || 0));
            st += tr(p, vals, fCM);
          }
        }
      }
    }
    st += '</tbody>';
    document.getElementById('scenComparisonTable').innerHTML = st;
    renderScenarioSummary(d, Y, _scenCache);
  } finally {
    _scenComparisonInflight = false;
  }
}

function renderScenarioSummary(d, Y, cache) {
  const idx2033 = Y.indexOf(2033);

  // Resolution: hardcoded
  const resolCum = {};
  for (const p of PARTNERS) resolCum[p] = RESOLUTION_DATA[p].noTax.slice(0, 4).reduce((a, b) => a + b, 0);
  const resolEbitda33 = RESOLUTION_DATA.EBITDA[6] * 1.04;
  const resolOwn = {EB: 27.5, JS: 22.5, JJB: 50.0};
  const resolMult = 7;
  const resolBV = resolEbitda33 * resolMult;

  // No Expansion
  const noExpCum = {};
  const noTax = (d.partners_no_exp && d.partners_no_exp._tax) || {};
  for (const p of PARTNERS) {
    const arr = d.partners_no_exp && d.partners_no_exp[p];
    if (!arr) { noExpCum[p] = 0; continue; }
    let sum = 0;
    for (let i = 0; i < 4; i++) sum += arr[i] - (noTax[p] ? noTax[p][i] : 0);
    noExpCum[p] = sum;
  }
  const noExpEbitda33 = (d.partners_no_exp && d.partners_no_exp._waterfall && d.partners_no_exp._waterfall.op_inc[idx2033]) || 0;
  const noExpOwn = {EB: 27.5, JS: 22.5, JJB: 50.0};
  const noExpMult = 7;
  const noExpBV = noExpEbitda33 * noExpMult;

  const computeFor = (ds, multiple) => {
    const cum = {};
    const own = {};
    for (const p of PARTNERS) {
      const pd = ds.partners && ds.partners[p];
      if (!pd) { cum[p] = 0; own[p] = 0; continue; }
      let sum = 0;
      for (let i = 0; i < 4; i++) sum += (pd.total[i] || 0) - (pd.tax_dist[i] || 0);
      cum[p] = sum;
      own[p] = (ds.ownership && ds.ownership[idx2033] && ds.ownership[idx2033][p]) || 0;
    }
    const ebitda33 = (ds.op_inc && ds.op_inc[idx2033]) || 0;
    return {cum, own, ebitda33, bv: ebitda33 * multiple, multiple};
  };

  const d3 = cache && cache.d3 ? computeFor(cache.d3, 8.5) : null;
  const d4 = cache && cache.d4 ? computeFor(cache.d4, 10)  : null;

  const fmt = v => v == null ? '—' : (v / 1e6).toFixed(2);
  let st = `<thead><tr><th></th>${PARTNERS.map(p => `<th>${p}</th>`).join('')}</tr></thead><tbody>`;
  st += `<tr class="section-header"><td colspan="4">Cum After-Tax CF ('26–'29)</td></tr>`;
  st += `<tr><td>Resolution</td>${PARTNERS.map(p => `<td>${fmt(resolCum[p])}</td>`).join('')}</tr>`;
  st += `<tr><td>No Expansion</td>${PARTNERS.map(p => `<td>${fmt(noExpCum[p])}</td>`).join('')}</tr>`;
  st += `<tr><td>3 blk · No PH</td>${PARTNERS.map(p => `<td>${d3 ? fmt(d3.cum[p]) : '—'}</td>`).join('')}</tr>`;
  st += `<tr><td>4 blk · Full PH</td>${PARTNERS.map(p => `<td>${d4 ? fmt(d4.cum[p]) : '—'}</td>`).join('')}</tr>`;

  st += `<tr class="section-header"><td colspan="4">Stake Value '33 (EBITDA × multiple × own%)</td></tr>`;
  const mkValRow = (label, bv, own, mult, ebitda) => {
    const sub = ` <span style="font-size:9px;color:var(--text-dim)">(EBITDA ${(ebitda/1e6).toFixed(1)}M × ${mult}x)</span>`;
    return `<tr><td>${label}${sub}</td>${PARTNERS.map(p => `<td>${fmt(bv * (own[p] || 0) / 100)}</td>`).join('')}</tr>`;
  };
  st += mkValRow('Resolution',     resolBV,  resolOwn, resolMult, resolEbitda33);
  st += mkValRow('No Expansion',   noExpBV,  noExpOwn, noExpMult, noExpEbitda33);
  if (d3) st += mkValRow('3 blk · No PH',  d3.bv, d3.own, d3.multiple, d3.ebitda33);
  if (d4) st += mkValRow('4 blk · Full PH', d4.bv, d4.own, d4.multiple, d4.ebitda33);
  st += '</tbody>';
  document.getElementById('scenSummaryTable').innerHTML = st;
}

// --- INIT ---
async function loadResolutionData() {
  if (RESOLUTION_DATA) return;
  const r = await fetch('/api/constants');
  const c = await r.json();
  RESOLUTION_DATA = c.resolution_data;
}

async function refresh() {
  await Promise.all([loadSettings(), loadResolutionData()]);
  // Zero out unused categories (tomato, lettuce-new, land) in memory
  settings.newTAcres = 0;
  settings.newLAcres = 0;
  settings.tomatoBuildRevPerAc = 0;
  settings.tomatoBuyRevPerAc = 0;
  settings.tomatoPurchasePrice = 0;
  settings.tomatoHardAssets = 0;
  settings.tomatoCostPerAc = 0;
  settings.landAcres = 0;

  if (!settings.expansionLender) {
    setLender('SBA');
    return;
  }
  if (activePreset === null) activePreset = detectActivePreset();
  buildSidebar();
  await compute();
}
refresh();
window.addEventListener('focus', refresh);
</script>
