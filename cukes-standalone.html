<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cukes lb/day — Expansion Planner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --text: #d8e8d8; --text-sub: #b0d0b0; --text-muted: #88b888; --text-dim: #5a8a5a;
  --green: #7dd17a; --yellow: #e0c860;
  --border: #2a4a2a; --bg: #0d1a0d; --panel: #121f12; --panel-dark: #0a100a; --accent: #6aae66;
  --header-bg: linear-gradient(135deg, #0d1a0d, #162816, #0d1a0d);
  --slider-track: #243624; --slider-fill: #5a9e55; --slider-thumb: #5a9e55; --slider-thumb-border: #0d1a0d;
}
body.light {
  --text: #3a4a3a; --text-sub: #4a5a4a; --text-muted: #3a6a3a; --text-dim: #6a9a6a;
  --green: #2a7a28; --yellow: #8a7018;
  --border: #b0c0b0; --bg: #e8eae8; --panel: #f0f2f0; --panel-dark: #dce0dc; --accent: #2a6a28;
  --header-bg: linear-gradient(135deg, #d8dcd8, #e4e8e4, #d8dcd8);
  --slider-track: #a0c8a0; --slider-fill: #2a6a28; --slider-thumb: #2a6a28; --slider-thumb-border: #e0e8e0;
}
body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; padding-bottom: 60px; }

.header { background: var(--header-bg); border-bottom: 1px solid var(--border); padding: 22px 32px 18px; position: sticky; top: 0; z-index: 100; }
.header-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; }
.header-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--text); }

.layout { max-width: 1100px; margin: 0 auto; padding: 20px 32px 0; display: grid; grid-template-columns: 280px 1fr; gap: 22px; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
.panel-title { font-size: 9px; letter-spacing: 0.16em; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }

.btn { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); font-family: inherit; font-size: 10px; padding: 3px 8px; cursor: pointer; }

.slider-group { padding-top: 10px; }
.slider-header { display: flex; justify-content: space-between; align-items: flex-end; }
.slider-label { font-size: 10px; letter-spacing: 0.08em; color: var(--text-sub); text-transform: uppercase; line-height: 1; }
.slider-sublabel { font-size: 9px; color: var(--text-muted); margin-top: 1px; }
.slider-value { font-size: 14px; color: var(--text); font-weight: 700; white-space: nowrap; line-height: 1; }

input[type=range] { width: 100%; appearance: none; -webkit-appearance: none; height: 3px; border-radius: 2px; outline: none; cursor: pointer; margin-top: 7px; padding: 0; display: block; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: inherit; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--slider-thumb); cursor: pointer; border: 2px solid var(--slider-thumb-border); margin-top: -5px; }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: inherit; border: none; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--slider-thumb); cursor: pointer; border: 2px solid var(--slider-thumb-border); }

.toggle-row { display: flex; align-items: center; gap: 8px; padding: 10px 0 4px; }
.toggle-row input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
.toggle-row label { font-size: 10px; color: var(--text-sub); cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; }

.kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; margin-bottom: 18px; }
.kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 11px 12px; }
.kpi-label { font-size: 9px; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; text-align: right; }
.kpi-value { font-size: 17px; font-weight: 700; line-height: 1; color: var(--text); text-align: right; }
.kpi-sub { font-size: 9px; color: var(--text-dim); margin-top: 4px; text-align: right; }

.chart-panel { margin-bottom: 18px; }

.fin-table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: 'DM Mono', monospace; table-layout: fixed; }
.fin-table th:first-child, .fin-table td:first-child { width: 140px; }
.fin-table th { font-size: 14px; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); font-weight: 700; }
.fin-table th:first-child { text-align: left; }
.fin-table td { text-align: right; padding: 5px 8px; border-bottom: 1px solid #1a2e1a; color: var(--text-sub); }
.fin-table td:first-child { text-align: left; color: var(--text-muted); }
.fin-table tr.section-header td { color: var(--accent); font-weight: 700; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 12px; border-bottom: 1px solid var(--border); }
.fin-table tr.total-row-table td { color: var(--text); font-weight: 700; border-top: 1px solid var(--border); border-bottom: 2px solid var(--border); }
.fin-table tr.subtotal-row td { color: var(--green); font-weight: 700; border-bottom: 1px solid var(--border); }

.roi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.roi-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--panel-dark); border-radius: 4px; cursor: pointer; }
.roi-label { font-size: 10px; color: var(--text-muted); }
.roi-value { font-size: 14px; font-weight: 700; }

/* Gantt full-width wrapper */
.gantt-wrapper { max-width: 1100px; margin: 0 auto; padding: 12px 32px 0; }

/* Gantt Chart */
.gantt-container { font-size: 10px; }
.gantt-header, .gantt-row {
  display: grid;
  grid-template-columns: 88px 38px 46px 40px 50px 44px 52px 40px 36px 36px 60px 42px 16px 1fr;
  align-items: center;
  gap: 0;
}
.gantt-header { border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 2px; }
.gantt-row { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
.gantt-label { padding: 0 4px; white-space: nowrap; overflow: hidden; }
.gantt-crop-name { font-size: 10px; color: var(--text-sub); line-height: 1.2; }
.gantt-cell { text-align: center; padding: 0 2px; font-size: 10px; color: var(--text-sub); }
.gantt-cell-muted { text-align: center; padding: 0 2px; font-size: 9px; color: var(--text-muted); }
.gantt-left { text-align: left; }
.gantt-right { text-align: right; }
.gantt-input {
  width: 44px; background: var(--panel-dark); color: var(--text-sub);
  border: 1px solid var(--border); border-radius: 3px;
  font-family: inherit; font-size: 10px; padding: 2px 4px 2px 2px; text-align: right;
}
.gantt-input::-webkit-inner-spin-button, .gantt-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.gantt-input[type=number] { -moz-appearance: textfield; }
.gantt-select {
  background: var(--panel-dark); color: var(--text-sub);
  border: 1px solid var(--border); border-radius: 3px;
  font-family: inherit; font-size: 9px; padding: 1px 2px;
  cursor: pointer; max-width: 100%;
}
.gantt-timeline-header {
  display: grid;
  grid-template-columns: repeat(28, 1fr);
}
.gantt-year {
  text-align: center; font-size: 9px; color: var(--text-muted);
  letter-spacing: 0.05em;
}
.gantt-timeline {
  display: grid;
  grid-template-columns: repeat(28, 1fr);
  position: relative;
  min-height: 20px;
  align-items: center;
}
.gantt-q-line { height: 100%; pointer-events: none; grid-row: 1; }
.gantt-bar {
  height: 14px; border-radius: 2px; z-index: 1; grid-row: 1;
  user-select: none; -webkit-user-select: none;
}
.gantt-bar-build {
  background: repeating-linear-gradient(135deg, var(--accent), var(--accent) 2px, transparent 2px, transparent 5px);
  opacity: 0.7;
}
.gantt-bar-ramp {
  background: var(--accent); opacity: 0.4;
}
.gantt-bar-prod {
  background: var(--accent); opacity: 0.85;
}

.exp-detail { display: none; }
@media (max-width: 720px) { .layout { grid-template-columns: 1fr; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

</style>
<style>

    .panel, .fin-table, tr, .fin-table tbody { page-break-inside: avoid !important; break-inside: avoid !important; }
    /* Force collapsed sub-rows visible in print. */
    tr.sub-grown, tr.sub-sold { display: table-row !important; }
    /* Drop the horizontal scrollbars from the table wrappers. */

  }
  /* Always-on: hide scrollbar chrome on the table wrappers (content can still
     scroll on touch). */
  .panel div[style*="overflow-x"] { scrollbar-width: none; }
  .panel div[style*="overflow-x"]::-webkit-scrollbar { display: none; }

<script>
// Shared utilities for all dashboard pages

// --- TABLE DISPLAY ---
let _DN = 2; // trailing years to hide from tables/chart
function sl(arr) { return _DN ? arr.slice(0, -_DN) : arr; }
function yh(Y) { return sl(Y).map(y => `<th>'${String(y).slice(2)}</th>`).join(''); }
function sr(label, Y) { return `<tr class="section-header"><td colspan="${sl(Y).length + 1}">${label}</td></tr>`; }
function tr(label, data, fn, cls) {
  fn = fn || fCM;
  const d = _DN ? data.slice(0, -_DN) : data;
  return `<tr${cls ? ` class="${cls}"` : ''}><td>${label}</td>${d.map(v => `<td>${fn(v)}</td>`).join('')}</tr>`;
}

// --- FORMATTERS ---
function fK(n) {
  if (n == null || isNaN(n)) return '\u2014';
  const abs = Math.abs(n), sign = n < 0 ? '\u2212' : '';
  if (abs >= 1e6) return sign + (abs / 1e6).toFixed(1) + 'M';
  if (abs >= 1e3) return sign + Math.round(abs / 1e3).toLocaleString() + 'K';
  return sign + Math.round(abs).toLocaleString();
}
function fCK(n) {
  if (Math.abs(n) < 50) return '\u2014';
  const k = Math.round(Math.abs(n) / 1e3);
  return (n < 0 ? '\u2212' : '') + k.toLocaleString();
}
function fCM(n) {
  if (Math.abs(n) < 500) return '\u2014';
  return (n < 0 ? '\u2212' : '') + (Math.abs(n) / 1e6).toFixed(1);
}

// --- SLIDER BUILDER ---
const _sliderOpts = {};

function sliderBg(pct) {
  const s = getComputedStyle(document.documentElement);
  return `linear-gradient(to right,${s.getPropertyValue('--slider-fill').trim()} ${pct}%,${s.getPropertyValue('--slider-track').trim()} ${pct}%)`;
}

function makeSlider(key, opts) {
  _sliderOpts[key] = opts;
  const val = settings[key] ?? opts.def;
  const pct = ((val - opts.min) / (opts.max - opts.min)) * 100;
  const sub = opts.sub ? `<div class="slider-sublabel">${opts.sub(val)}</div>` : '';
  return `<div class="slider-group">
    <div class="slider-header">
      <div style="flex:1;padding-right:10px"><div class="slider-label">${opts.label}</div>${sub}</div>
      <span class="slider-value" id="sv-${key}">${opts.fmt(val)}</span>
    </div>
    <input type="range" id="sl-${key}" min="${opts.min}" max="${opts.max}" step="${opts.step}" value="${val}"
      style="background:${sliderBg(pct)}"
      oninput="onSlider('${key}',this)">
  </div>`;
}

function onSlider(key, el) {
  const opts = _sliderOpts[key];
  const val = Number(el.value);
  const pct = ((val - opts.min) / (opts.max - opts.min)) * 100;
  el.style.background = sliderBg(pct);
  document.getElementById('sv-' + key).textContent = opts.fmt(val);
  updateSetting(key, val);
}

// --- THEME ---
const THEME_KEY = 'gh-expansion-theme';

function toggleTheme() {
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  document.getElementById('themeToggle').textContent = isLight ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
}

function initTheme() {
  if (localStorage.getItem(THEME_KEY) === 'light') {
    document.body.classList.add('light');
    const btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = 'dark';
  }
}

// --- NAVIGATION ---
function buildNav(activePage) {
  const pages = [
    {href: 'index.html', label: 'Expansion'},
    {href: 'partners.html', label: 'Partners'},
    {href: 'debt.html', label: 'Debt'},
    {href: 'depreciation.html', label: 'Depreciation'},
    {href: 'employees.html', label: 'Employees'},
    {href: 'cukes.html', label: 'Cukes'},
  ];
  const links = pages.map(p => {
    const active = p.href === activePage;
    const style = `color:var(--${active ? 'accent' : 'text-muted'});text-decoration:none;text-transform:uppercase;letter-spacing:0.1em${active ? ';font-weight:700' : ''}`;
    return `<a href="${p.href}" style="${style}">${p.label}</a>`;
  }).join('\n        ');
  return links;
}

</script>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const YEARS = [2025, 2026];
const CUTOFF = { 2025: 12, 2026: 3 };  // last included month per year

// Google Sheet sources (same as dash/lib/data-source.js, sheets mode)
const SHEETS = {
  invoices: '124y8JdWXmbf_hb1vfimHmGaKLVXrRHybw02w_ozCExE',
  grow:     '1VtEecYn-W1pbnIU1hRHfxIpkH2DtK7hj0CpcpiLoziM',
};
const INVOICE_GIDS = ['1254110782', '544460225'];  // invoices_23-25, invoices_2025 (holds 2026)
const GROW_TAB = 'grow_C_harvest';

function daysInMonth(year, m) { return new Date(year, m, 0).getDate(); }

function gvizFetch(sheetId, src) {
  return new Promise((resolve, reject) => {
    const tag = src.gid || src.tab || '0';
    const cbName = '_cb_' + String(tag).replace(/[^a-z0-9_]/gi,'') + '_' + Math.floor(Math.random()*1e9);
    let url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json;responseHandler:${cbName}`;
    if (src.gid) url += `&gid=${src.gid}`;
    if (src.tab) url += `&sheet=${encodeURIComponent(src.tab)}`;
    window[cbName] = (resp) => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      if (!resp || resp.status === 'error') { reject(resp ? resp.errors : 'no response'); return; }
      resolve(resp.table);
    };
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => { delete window[cbName]; reject('Network error loading ' + tag); };
    document.head.appendChild(script);
  });
}

function parseGvizTable(table) {
  const cols = table.cols.map(c => c.label);
  return table.rows.map(r => {
    const obj = {};
    r.c.forEach((cell, i) => {
      const col = cols[i];
      if (!col) return;
      if (!cell || cell.v === null || cell.v === undefined) { obj[col] = ''; return; }
      if (typeof cell.v === 'string' && cell.v.startsWith('Date(')) {
        const dm = cell.v.match(/Date\((\d+),(\d+),(\d+)\)/);
        if (dm) {
          obj[col] = cell.f || cell.v;
          // Only the row's primary date column populates _y/_m/_d. Other
          // date columns (e.g. ReportedDateTime) would otherwise clobber
          // these and silently shift bucketing onto the wrong date.
          if (col === 'HarvestDate' || col === 'InvoiceDate') {
            obj._y = +dm[1];
            obj._m = +dm[2] + 1;
            obj._d = +dm[3];
          }
        }
      } else {
        obj[col] = cell.v;
      }
    });
    return obj;
  });
}

function aggregate(rows, filterFn, poundsFn) {
  const totals = {};
  for (const r of rows) {
    if (!filterFn(r)) continue;
    const y = r._y, m = r._m;
    if (!y || !m) continue;
    if (!YEARS.includes(y)) continue;
    if (m > CUTOFF[y]) continue;
    const key = y + '-' + m;
    totals[key] = (totals[key] || 0) + (poundsFn(r) || 0);
  }
  return totals;
}

function perDay(totals, y, m) {
  const lbs = totals[y + '-' + m];
  if (!lbs) return null;
  return lbs / daysInMonth(y, m);
}

// Single-year selection per month. Jan–Mar from user-toggled winter year
// (default 2025). Apr–Dec always 2025 (only year with data for those months).
let _winterYear = Number(localStorage.getItem('cukesWinterYear')) || 2025;
if (_winterYear !== 2025 && _winterYear !== 2026) _winterYear = 2025;
function setWinterYear(y) {
  _winterYear = Number(y);
  localStorage.setItem('cukesWinterYear', String(_winterYear));
  renderAll();
}
window.setWinterYear = setWinterYear;
function yearForMonth(m) { return m <= 3 ? _winterYear : 2025; }

function perMonthLbPerDay(totals) {
  const out = Array(12).fill(null);
  for (let m = 1; m <= 12; m++) {
    const y = yearForMonth(m);
    if (m > CUTOFF[y]) continue;
    const v = perDay(totals, y, m);
    if (v != null) out[m - 1] = v;
  }
  return out;
}

// Group Grade-1 rows by SeedingCycle (globally unique). For each cycle: last
// harvest date + max HarvestDay. Exclude cycles ending in the current HST
// month (always look backwards). Bucket by (year, end-month), average max
// HarvestDay per bucket, convert to weeks. Returns a `${y}-${m}` map; the
// caller resolves which year to display per column via yearForMonth().
function retireWeeksByMonth(growRows) {
  const nowHst = new Date(Date.now() - 10 * 3600e3);
  const curY = nowHst.getUTCFullYear();
  const curM = nowHst.getUTCMonth() + 1;

  const byCycle = {};
  for (const r of growRows) {
    const sc = r.SeedingCycle;
    if (!sc || !r._y || !r._m) continue;
    const hd = Number(r.HarvestDay);
    if (!isFinite(hd) || hd < 0) continue;
    const dateKey = r._y * 10000 + r._m * 100 + r._d;
    const c = byCycle[sc] ||= { lastDateKey: 0, lastY: 0, lastM: 0, maxDay: 0 };
    if (dateKey > c.lastDateKey) { c.lastDateKey = dateKey; c.lastY = r._y; c.lastM = r._m; }
    if (hd > c.maxDay) c.maxDay = hd;
  }

  const buckets = {};
  for (const sc in byCycle) {
    const c = byCycle[sc];
    if (c.lastY === curY && c.lastM === curM) continue;  // current month excluded
    (buckets[`${c.lastY}-${c.lastM}`] ||= []).push(c.maxDay);
  }

  // HarvestDay is days from seeding; transplant into the GH happens ~14 days
  // after seeding, and "weeks at shutdown" is meant to count weeks in the GH.
  const TRANSPLANT_OFFSET_DAYS = 14;
  const out = {};
  for (const k in buckets) {
    const arr = buckets[k];
    const avgDay = arr.reduce((a, b) => a + b, 0) / arr.length;
    out[k] = (avgDay - TRANSPLANT_OFFSET_DAYS) / 7;
  }
  return out;
}

function fmt(v) {
  if (v == null) return '<td class="empty">—</td>';
  const cls = v < 0 ? ' class="neg"' : '';
  return `<td${cls}>${Math.round(v).toLocaleString()}</td>`;
}

function fmtWeeks(v) {
  if (v == null) return '<td class="empty">—</td>';
  return `<td>${v.toFixed(1)}</td>`;
}

function fmtIndex(v) {
  if (v == null) return '<td class="empty">—</td>';
  return `<td>${(v * 100).toFixed(0)}%</td>`;
}

// Cross-variety (K+J) seasonality per month = (monthly lb/day − max) / max.
// Expressed as a non-positive fraction: 0 for the peak month, negative for
// every other month. Uses the same year-per-month selection as other rows.
function seasonalityKJ(growByVM) {
  const perMonth = Array(12).fill(null);
  for (let m = 1; m <= 12; m++) {
    const y = yearForMonth(m);
    if (m > CUTOFF[y]) continue;
    const k = growByVM[`K-${y}-${m}`] || 0;
    const j = growByVM[`J-${y}-${m}`] || 0;
    if (k + j > 0) perMonth[m - 1] = (k + j) / daysInMonth(y, m);
  }
  const validVals = perMonth.filter(v => v != null);
  if (!validVals.length) return Array(12).fill(null);
  const maxVal = Math.max(...validVals);
  return perMonth.map(v => v == null ? null : (v - maxVal) / maxVal);
}

// Loose match: invoice sheet Farm/Variety fields vary in casing across tabs.
function isCukeInvoice(r) {
  const farm = String(r.Farm || '').toLowerCase();
  const variety = String(r.Variety || '').toLowerCase();
  return farm === 'cuke' || farm === 'cucumber' || variety === 'cuke' || variety === 'cucumber';
}

// Classify K/J/E from raw Variety or ProductCode strings (first letter).
function classifyKJE(s) {
  const v = String(s || '').trim().toUpperCase();
  const c = v.charAt(0);
  return (c === 'K' || c === 'J' || c === 'E') ? c : null;
}

// { 'K-2025-07': lbs, ... } of grown lbs per (variety, year, month), Grade 1.
function growByVarietyMonth(growRows) {
  const totals = {};
  for (const r of growRows) {
    if (Math.round(r.Grade || 0) !== 1) continue;
    if (!r._y || !r._m) continue;
    if (!YEARS.includes(r._y)) continue;
    if (r._m > CUTOFF[r._y]) continue;
    const v = classifyKJE(r.Variety);
    if (!v) continue;
    const key = `${v}-${r._y}-${r._m}`;
    totals[key] = (totals[key] || 0) + (r.GreenhouseNetWeight || 0);
  }
  return totals;
}

// Per-variety lb/day by month, single year: Jan–Mar from 2026, Apr–Dec from 2025.
function avgLbPerDayByMonth(totals, variety) {
  const out = Array(12).fill(null);
  for (let m = 1; m <= 12; m++) {
    const y = yearForMonth(m);
    if (m > CUTOFF[y]) continue;
    const lbs = totals[`${variety}-${y}-${m}`];
    if (lbs) out[m - 1] = lbs / daysInMonth(y, m);
  }
  return out;
}

// Cumulative multiplier at each target week (marginal: +10/+7/+5/+2 for 9/10/11/12).
const RETIRE_MULT = { 8: 1.00, 9: 1.10, 10: 1.10 * 1.07, 11: 1.10 * 1.07 * 1.05, 12: 1.10 * 1.07 * 1.05 * 1.02 };

// Linear interpolation of the retire multiplier for fractional weeks.
function retireMultFor(weeks) {
  if (weeks == null || weeks <= 8) return 1.0;
  if (weeks >= 12) return RETIRE_MULT[12];
  const lo = Math.floor(weeks);
  return RETIRE_MULT[lo] + (weeks - lo) * (RETIRE_MULT[lo + 1] - RETIRE_MULT[lo]);
}

let _growByVM = null;   // cached for re-renders on retire-week toggle
let _retireWeeks = null;
let _constants = null;
let _settings = null;
let _targetWeek = Number(localStorage.getItem('cukesTargetWeek')) || 11;

function capacityFactor(variety) {
  const ex = _constants && _constants.existing_ops;
  if (!ex || !_settings) return 1;
  if (variety === 'K') return (ex.keiki_acres    + (_settings.newKAcres || 0)) / ex.keiki_acres;
  if (variety === 'J') return (ex.japanese_acres + (_settings.newJAcres || 0)) / ex.japanese_acres;
  if (variety === 'E') return (ex.english_acres  + (_settings.newEAcres || 0)) / ex.english_acres;
  return 1;
}

function setTargetWeek(w) {
  _targetWeek = w;
  localStorage.setItem('cukesTargetWeek', String(w));
  if (_summary) renderAll();
}
window.setTargetWeek = setTargetWeek;

function toggleSub(group) {
  const key = group === 'grown' ? 'cukesGrownOpen' : 'cukesSoldOpen';
  const open = localStorage.getItem(key) === '1';
  localStorage.setItem(key, open ? '0' : '1');
  if (_summary) renderAll();
}
window.toggleSub = toggleSub;

function renderProjection() {
  if (!_summary || !_constants || !_settings) return;

  // Historical retire mults come from actual Jan–Dec weeks; box 1's actuals
  // already reflect this. To express the override as an uplift, divide:
  //   ratio = retire_mult(max(historical, override)) / retire_mult(historical)
  // If override ≤ historical, ratio = 1 (no change). Override > historical → uplift.
  // retireWeeks is a `${y}-${m}` map. For each displayed column, pick the year
  // shown by yearForMonth so column "1-25" really means Jan 2025 (etc.).
  const retireWeeksMap = _summary.retireWeeks || {};
  const histWeeks = Array(12).fill(null).map((_, i) => {
    const m = i + 1;
    const v = retireWeeksMap[`${yearForMonth(m)}-${m}`];
    return (v == null) ? null : v;
  });
  const effWeeks = histWeeks.map(w => Math.max(w || 0, _targetWeek));
  const histMultByMonth = histWeeks.map(w => retireMultFor(w || 0));
  const retMultByMonth = effWeeks.map((w, i) => {
    const hM = histMultByMonth[i];
    if (!hM || hM <= 0) return 1;
    return retireMultFor(w) / hM;
  });
  const seasonality = seasonalityKJ(_summary.growByVM);

  const vars = ['K', 'J', 'E'];
  const current = {
    K: avgLbPerDayByMonth(_summary.growByVM, 'K'),
    J: avgLbPerDayByMonth(_summary.growByVM, 'J'),
    E: avgLbPerDayByMonth(_summary.growByVM, 'E'),
  };

  const sumRow = obj => Array(12).fill(null).map((_, i) => {
    let sum = 0, any = false;
    for (const v of vars) if (obj[v][i] != null) { sum += obj[v][i]; any = true; }
    return any ? sum : null;
  });
  const curTot = sumRow(current);

  // row() renders monthly cells + an Annual cell on the far right.
  // annualCell is an already-rendered <td>…</td> string, or null for '—'.
  const row = (label, vals, cls, formatter, annualCell) => {
    const f = formatter || fmt;
    const monthly = vals.map(f).join('');
    const ann = annualCell == null ? '<td class="empty">—</td>' : annualCell;
    return `<tr${cls ? ` class="${cls}"` : ''}><td>${label}</td>${monthly}${ann}</tr>`;
  };
  // Collapsible per-variety rows above each Total. State persists in
  // localStorage; default collapsed.
  const grownOpen = localStorage.getItem('cukesGrownOpen') === '1';
  const soldOpen  = localStorage.getItem('cukesSoldOpen')  === '1';
  const subRow = (label, vals, formatter, annualCell, group) => {
    const hidden = (group === 'grown' ? !grownOpen : !soldOpen) ? ' style="display:none"' : '';
    const f = formatter || fmt;
    const monthly = vals.map(f).join('');
    const ann = annualCell == null ? '<td class="empty">—</td>' : annualCell;
    return `<tr class="sub-${group}"${hidden}><td style="padding-left:18px">${label}</td>${monthly}${ann}</tr>`;
  };
  const totalRow = (group, label, vals, cls, formatter, annualCell) => {
    const open = group === 'grown' ? grownOpen : soldOpen;
    const sign = open ? '−' : '+';
    const f = formatter || fmt;
    const monthly = vals.map(f).join('');
    const ann = annualCell == null ? '<td class="empty">—</td>' : annualCell;
    const labelCell = `<td style="cursor:pointer;user-select:none" onclick="toggleSub('${group}')"><span style="display:inline-block;width:12px;color:var(--text-muted)">${sign}</span>${label}</td>`;
    return `<tr${cls ? ` class="${cls}"` : ''}>${labelCell}${monthly}${ann}</tr>`;
  };
  const monthHdr = i => `${i + 1}-${String(yearForMonth(i + 1) % 100).padStart(2, '0')}`;
  const tableHdr = '<table class="fin-table"><thead><tr><th></th>' +
    Array(12).fill(0).map((_, i) => `<th>${monthHdr(i)}</th>`).join('') +
    '<th>Annual</th></tr></thead><tbody>';

  // Annual formatters.
  const avgOf = arr => {
    const valid = arr.filter(v => v != null);
    if (!valid.length) return null;
    return valid.reduce((a, b) => a + b, 0) / valid.length;
  };
  const fAvgLb = v => v == null
    ? '<td class="empty">—</td>'
    : `<td>${Math.round(v).toLocaleString()}</td>`;
  const fAvg = arr => {
    const v = avgOf(arr);
    return v == null ? null : `<td>${v.toFixed(1)}</td>`;
  };
  const fPeak = arr => {
    const valid = arr.filter(v => v != null);
    if (!valid.length) return null;
    return `<td>${Math.max(...valid).toFixed(1)}</td>`;
  };
  const fDollars = v => `<td>${(v / 1e6).toFixed(1)}M</td>`;

  // Adjusted prices (shared between box 1 and box 2 revenue rows).
  const prices = _summary.prices || { K: 0, J: 0, E: 0 };
  const infMult = 1 + (_inflation / 100);
  const adjPrice = { K: prices.K * infMult, J: prices.J * infMult, E: prices.E * infMult };

  // --- Controls between boxes ---
  const btns = [8, 9, 10, 11, 12].map(w => {
    const active = w === _targetWeek ? 'border-color:var(--accent);color:var(--accent)' : '';
    return `<button class="btn" style="${active};margin-left:4px" onclick="setTargetWeek(${w})">W${w}</button>`;
  }).join('');
  const controlsEl = document.getElementById('projControls');
  controlsEl.innerHTML =
    `<span style="font-size:10px;color:var(--text-muted)">Target Shutdown week: ${btns}</span>`;
  controlsEl.style.display = '';

  // --- Box 1: current state ---
  const salesAvg = perMonthLbPerDay(_summary.saleTotals);
  const slippage = salesAvg.map(v => v == null ? null : v * SLIPPAGE_RATE);
  const unsold = curTot.map((c, i) => {
    const s = salesAvg[i];
    if (c == null && s == null) return null;
    return (c || 0) - (s || 0) - (slippage[i] || 0);
  });
  // Required acres per month — used by both box 1 (summary footer) and box 2.
  const exK = _constants.existing_ops.keiki_acres;
  const exJJJ = _constants.existing_ops.japanese_acres;
  const exE = _constants.existing_ops.english_acres;
  const perAcOf = (arr, ex) => arr.map((v, i) => (v == null || !ex) ? null : (v / ex) * retMultByMonth[i]);
  const perAcK = perAcOf(current.K, exK);
  const perAcJ = perAcOf(current.J, exJJJ);
  // Required = target grossed up by slippage (need to grow extra to cover 5% loss).
  const reqK = perAcK.map((p, i) => p == null ? null : ceil01((targetForMonth('K', i) * (1 + SLIPPAGE_RATE)) / p));
  const reqJ = perAcJ.map((p, i) => p == null ? null : ceil01((targetForMonth('J', i) * (1 + SLIPPAGE_RATE)) / p));
  const reqE = perAcJ.map((p, i) => p == null ? null : ceil01((targetForMonth('E', i) * (1 + SLIPPAGE_RATE)) / p));
  const reqTotal = reqK.map((k, i) => {
    const j = reqJ[i], e = reqE[i];
    if (k == null && j == null && e == null) return null;
    return (k || 0) + (j || 0) + (e || 0);
  });
  const peakK = Math.max(...reqK.filter(v => v != null));
  const peakJ = Math.max(...reqJ.filter(v => v != null));
  const peakE = Math.max(...reqE.filter(v => v != null));

  const fmtAcres = v => v == null ? '<td class="empty">—</td>' : `<td>${v.toFixed(1)}</td>`;
  const peakAnnual = arr => {
    const valid = arr.filter(v => v != null);
    if (!valid.length) return null;
    return `<td>${Math.max(...valid).toFixed(1)}</td>`;
  };

  let box1 = '<div style="overflow-x:auto">' + tableHdr;
  // Box 1 shows actual historical retire weeks (no override).
  box1 += row('Weeks (shutdown)', histWeeks, null, fmtWeeks, fAvg(histWeeks));
  box1 += row('Season (Deficit from Max)', seasonality, null, fmtIndex, null);
  box1 += subRow('Grown K', current.K, fmt, fAvgLb(avgOf(current.K)), 'grown');
  box1 += subRow('Grown J', current.J, fmt, fAvgLb(avgOf(current.J)), 'grown');
  box1 += subRow('Grown E', current.E, fmt, fAvgLb(avgOf(current.E)), 'grown');
  box1 += totalRow('grown', 'Grown Total', curTot, 'diff-below', fmt, fAvgLb(avgOf(curTot)));
  const salesK = avgLbPerDayByMonth(_summary.saleByVM, 'K');
  const salesJ = avgLbPerDayByMonth(_summary.saleByVM, 'J');
  const salesE = avgLbPerDayByMonth(_summary.saleByVM, 'E');
  box1 += subRow('Sold K', salesK, fmt, fAvgLb(avgOf(salesK)), 'sold');
  box1 += subRow('Sold J', salesJ, fmt, fAvgLb(avgOf(salesJ)), 'sold');
  box1 += subRow('Sold E', salesE, fmt, fAvgLb(avgOf(salesE)), 'sold');
  box1 += totalRow('sold', 'Sold Total', salesAvg, 'diff-below', fmt, fAvgLb(avgOf(salesAvg)));
  box1 += row('Surplus/Deficit', unsold, null, fmt, fAvgLb(avgOf(unsold)));

  // Revenue row — per-variety sales × days × price, summed per month.
  const box1RevMonth = Array(12).fill(null).map((_, i) => {
    const d = daysInMonth(2025, i + 1);
    return (salesK[i] || 0) * d * adjPrice.K
         + (salesJ[i] || 0) * d * adjPrice.J
         + (salesE[i] || 0) * d * adjPrice.E;
  });
  const fmtDol = v => v == null ? '<td class="empty">—</td>' :
    `<td>${(v / 1e3).toFixed(0)}K</td>`;
  const box1AnnualRev = box1RevMonth.reduce((a, b) => a + b, 0);
  box1 += `<tr class="diff-row"><td>Revenue ($)</td>${box1RevMonth.map(fmtDol).join('')}${fDollars(box1AnnualRev)}</tr>`;

  const existingTotal = exK + exJJJ + exE;
  box1 += '</tbody></table></div>';
  document.getElementById('projBody').innerHTML = box1;
  document.getElementById('projPanel').style.display = '';

  // --- Shared: per-month target values (Jan–Mar winter, Apr–Dec summer) ---
  const targetPerMonth = v => Array(12).fill(null).map((_, i) => targetForMonth(v, i));
  const targK = targetPerMonth('K');
  const targJ = targetPerMonth('J');
  const targE = targetPerMonth('E');
  const targTot = targK.map((k, i) => k + targJ[i] + targE[i]);

  // Monthly target revenue (full demand revenue per month).
  const monthlyTargetRev = Array(12).fill(0).map((_, i) => {
    const d = daysInMonth(2025, i + 1);
    return targK[i] * d * adjPrice.K + targJ[i] * d * adjPrice.J + targE[i] * d * adjPrice.E;
  });

  // Capacity supply (lb/day) at A acres, after retire uplift.
  const supplyAt = A => curTot.map((v, i) => v == null ? null : v * retMultByMonth[i] * (A / existingTotal));

  // Demand-capped revenue per month at A acres. Slippage is 5% of sales, so
  // max sales the supply can support = supply / (1 + SLIPPAGE_RATE).
  const revAt = A => Array(12).fill(0).map((_, i) => {
    const supply = curTot[i] == null ? 0 : curTot[i] * retMultByMonth[i] * (A / existingTotal);
    if (targTot[i] <= 0) return 0;
    const maxSalesFromSupply = supply / (1 + SLIPPAGE_RATE);
    const frac = Math.min(1, maxSalesFromSupply / targTot[i]);
    return frac * monthlyTargetRev[i];
  });

  // Helpers shared by box 2 and box 3 rendering.
  const fmtAc = v => v == null ? '<td class="empty">—</td>' : `<td>${v.toFixed(1)}</td>`;
  const rowAc = (label, vals, cls) => {
    const peak = fPeak(vals);
    const ann = peak == null ? '<td class="empty">—</td>' : peak;
    return `<tr${cls ? ` class="${cls}"` : ''}><td>${label}</td>${vals.map(fmtAc).join('')}${ann}</tr>`;
  };
  const inputStyle = 'width:60px;background:var(--panel-dark);color:var(--text);' +
    'border:1px solid var(--border);border-radius:3px;font-family:inherit;' +
    'font-size:11px;padding:2px 4px;text-align:right';
  const targetRow = (label, key) => {
    const w = TARGETS[key].winter;
    const s = TARGETS[key].summer;
    let cells = '';
    const monthlyArr = [];
    for (let i = 0; i < 12; i++) {
      const val = targetForMonth(key, i);
      monthlyArr.push(val);
      if (key === 'E') {
        cells += `<td><input type="number" value="${val}" min="0" step="100"
          onchange="setTargetMonthly('E',${i},this.value)" style="${inputStyle}"></td>`;
      } else if (i === 0) {
        cells += `<td><input type="number" value="${w}" min="0" step="100"
          onchange="setTarget('${key}','winter',this.value)" style="${inputStyle}"></td>`;
      } else if (i === 3) {
        cells += `<td><input type="number" value="${s}" min="0" step="100"
          onchange="setTarget('${key}','summer',this.value)" style="${inputStyle}"></td>`;
      } else {
        cells += `<td>${val.toLocaleString()}</td>`;
      }
    }
    const annual = fAvgLb(avgOf(monthlyArr));
    return `<tr><td>${label}</td>${cells}${annual}</tr>`;
  };

  // --- Box 2: Extend and Sell more (existing 12.55 ac × retire uplift) ---
  // Solve for sales we can actually move: E fixed at 600, K/J split 2:1 of
  // what's left after slippage budget, each rounded to nearest 250 lb/day.
  const round250 = v => Math.round(v / 250) * 250;
  const E_FIXED = 600;
  const box2Supply = supplyAt(existingTotal);
  const box2SalesK = Array(12).fill(null);
  const box2SalesJ = Array(12).fill(null);
  const box2SalesE = Array(12).fill(null);
  for (let i = 0; i < 12; i++) {
    const supply = box2Supply[i];
    if (supply == null) continue;
    const totalSales = supply / (1 + SLIPPAGE_RATE);
    const e = Math.min(E_FIXED, Math.max(0, totalSales));
    const remaining = Math.max(0, totalSales - e);
    box2SalesE[i] = e;
    box2SalesK[i] = Math.max(0, round250(remaining * (2 / 3)));
    box2SalesJ[i] = Math.max(0, round250(remaining * (1 / 3)));
  }
  const box2SalesTot = box2SalesK.map((k, i) => (k || 0) + (box2SalesJ[i] || 0) + (box2SalesE[i] || 0));
  const box2Slip = box2SalesTot.map(v => v * SLIPPAGE_RATE);
  const box2Surplus = box2Supply.map((v, i) =>
    v == null ? null : v - box2SalesTot[i] - box2Slip[i]);
  const box2RevMonth = Array(12).fill(0).map((_, i) => {
    const d = daysInMonth(2025, i + 1);
    return (box2SalesK[i] || 0) * d * adjPrice.K
         + (box2SalesJ[i] || 0) * d * adjPrice.J
         + (box2SalesE[i] || 0) * d * adjPrice.E;
  });
  const box2AnnualRev = box2RevMonth.reduce((a, b) => a + b, 0);

  let box2 = '<div style="overflow-x:auto">' + tableHdr;
  box2 += row('Total Grown (extended)', box2Supply, null, fmt, fAvgLb(avgOf(box2Supply)));
  box2 += row('Sales K', box2SalesK, null, fmt, fAvgLb(avgOf(box2SalesK)));
  box2 += row('Sales J', box2SalesJ, null, fmt, fAvgLb(avgOf(box2SalesJ)));
  box2 += row('Sales E', box2SalesE, null, fmt, fAvgLb(avgOf(box2SalesE)));
  box2 += row('Sales Total', box2SalesTot, 'diff-below', fmt, fAvgLb(avgOf(box2SalesTot)));
  box2 += `<tr><td>Revenue ($)</td>${box2RevMonth.map(fmtDol).join('')}${fDollars(box2AnnualRev)}</tr>`;
  box2 += row('Surplus/Deficit', box2Surplus, 'diff-below', fmt, fAvgLb(avgOf(box2Surplus)));
  box2 += '</tbody></table></div>';
  document.getElementById('extendBody').innerHTML = box2;
  document.getElementById('extendPanel').style.display = '';

  // --- Box 3: Add Greenhouses ---
  const box3AddedAc = _addedGHs * AC_PER_GH;
  const box3TotalAc = existingTotal + box3AddedAc;
  const box3Supply = supplyAt(box3TotalAc);
  const box3Slip = targTot.map(v => v * SLIPPAGE_RATE);
  const box3Surplus = box3Supply.map((v, i) =>
    v == null ? null : v - targTot[i] - box3Slip[i]);
  const box3RevMonth = revAt(box3TotalAc);
  const box3AnnualRev = box3RevMonth.reduce((a, b) => a + b, 0);

  // Toggle UI for GH count.
  const ghBtns = [0, 1, 2, 3, 4].map(n => {
    const active = n === _addedGHs ? 'border-color:var(--accent);color:var(--accent)' : '';
    return `<button class="btn" style="${active};margin-left:4px" onclick="setAddedGHs(${n})">+${n}</button>`;
  }).join('');
  document.getElementById('addGhControls').innerHTML =
    `<span style="font-size:10px;color:var(--text-muted)">
       Add greenhouses (60k sf each, ~${AC_PER_GH.toFixed(2)} ac): ${ghBtns}
       <span style="margin-left:16px">Total ac = ${box3TotalAc.toFixed(2)} (+${box3AddedAc.toFixed(2)} new)</span>
     </span>`;

  let box3 = '<div style="overflow-x:auto">' + tableHdr;
  box3 += row('Post Expansion', box3Supply, null, fmt, fAvgLb(avgOf(box3Supply)));
  box3 += targetRow('Target Sales K', 'K');
  box3 += targetRow('Target Sales J', 'J');
  box3 += targetRow('Target Sales E', 'E');
  box3 += row('Target Sales Total', targTot, 'diff-below', fmt, fAvgLb(avgOf(targTot)));
  box3 += `<tr><td>Revenue ($)</td>${box3RevMonth.map(fmtDol).join('')}${fDollars(box3AnnualRev)}</tr>`;
  box3 += row('Surplus/Deficit', box3Surplus, null, fmt, fAvgLb(avgOf(box3Surplus)));
  box3 += rowAc('Required Total (ac)', reqTotal);
  box3 += '</tbody></table></div>';
  document.getElementById('addGhBody').innerHTML = box3;
  document.getElementById('addGhPanel').style.display = '';

  // Stash for box 4 baseline + annual rev at each GH level (reuse box 3's
  // formula so the two panels don't drift apart).
  _box1AnnualRev = box1AnnualRev;
  _box2AnnualRev = box2AnnualRev;
  _box4AnnualRev = Array(5).fill(0).map((_, n) => {
    const A = existingTotal + n * AC_PER_GH;
    return revAt(A).reduce((a, b) => a + b, 0);
  });
  _box4ExistingTotal = existingTotal;

  const status = document.getElementById('status');
  if (status) status.style.display = 'none';
}

// ── Cache the sheet-derived summary in localStorage ───────────────────────
// The sheet fetches are the slow part of the page. Once aggregated into
// monthly arrays, nothing depends on the raw rows — projection re-renders
// only need the summary + current settings/constants + target week.
const CACHE_KEY = 'cukeSummary_v9';  // bumped when summary schema changes

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

function saveCache(summary) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(summary)); } catch {}
}

async function fetchSheetSummary() {
  const [invA, invB, growTbl] = await Promise.all([
    gvizFetch(SHEETS.invoices, { gid: INVOICE_GIDS[0] }),
    gvizFetch(SHEETS.invoices, { gid: INVOICE_GIDS[1] }),
    gvizFetch(SHEETS.grow,     { tab: GROW_TAB }),
  ]);
  const invoiceRows = [...parseGvizTable(invA), ...parseGvizTable(invB)];
  const growRows = parseGvizTable(growTbl);
  const grade1 = r => Math.round(r.Grade || 0) === 1;
  const growTotals = aggregate(growRows, grade1, r => r.GreenhouseNetWeight);
  const saleTotals = aggregate(invoiceRows, r => isCukeInvoice(r) && grade1(r), r => r.Pounds);
  const retireWeeks = retireWeeksByMonth(growRows.filter(grade1));
  const growByVM = growByVarietyMonth(growRows);

  // Base $/lb per variety from Grade 1 cuke invoices (ProductCode prefix K/J/E).
  // Also aggregate per-variety sales lbs by (year, month) for box 1 per-variety rows.
  const priceNum = { K: 0, J: 0, E: 0 };
  const priceDen = { K: 0, J: 0, E: 0 };
  const saleByVM = {};  // 'V-Y-M' -> lbs
  for (const r of invoiceRows) {
    if (!isCukeInvoice(r) || !grade1(r)) continue;
    const v = classifyKJE(r.ProductCode);
    if (!v) continue;
    const lbs = Number(r.Pounds) || 0;
    const dlrs = Number(r.Dollars) || 0;
    if (lbs <= 0) continue;
    if (!r._y || !r._m || !YEARS.includes(r._y) || r._m > CUTOFF[r._y]) continue;
    priceNum[v] += dlrs;
    priceDen[v] += lbs;
    const key = `${v}-${r._y}-${r._m}`;
    saleByVM[key] = (saleByVM[key] || 0) + lbs;
  }
  const prices = {};
  for (const v of ['K', 'J', 'E']) prices[v] = priceDen[v] > 0 ? priceNum[v] / priceDen[v] : 0;

  return {
    timestamp: Date.now(),
    growTotals,   // 'Y-M' -> lbs
    saleTotals,   // 'Y-M' -> lbs
    growByVM,     // 'V-Y-M' -> lbs
    saleByVM,     // 'V-Y-M' -> lbs
    retireWeeks,
    prices,
  };
}

}

function targetForMonth(v, monthIdx) {  // monthIdx = 0..11
  if (v === 'E') {
    const o = TARGETS.E_monthly[monthIdx];
    if (o != null && isFinite(o)) return o;
  }
  // Winter = Jan, Feb, Mar, Dec. Summer = Apr..Nov.
  return (monthIdx < 3 || monthIdx === 11) ? TARGETS[v].winter : TARGETS[v].summer;
}

function setTarget(v, season, val) {
  const n = Number(val);
  if (!isFinite(n) || n < 0) return;
  TARGETS[v][season] = n;

  localStorage.setItem('cukesTarget' + v + suffix, String(n));
  renderAll();

function renderRoi() {
  if (!_summary || !_constants || !_settings) return;
  if (!_box4AnnualRev || _box4AnnualRev.length !== 5) return;

  const existingTotal = _box4ExistingTotal;
  const acreLevels = Array(5).fill(0).map((_, n) => existingTotal + n * AC_PER_GH);
  // Existing row = baseline (today's actual ~ halfway between sales and capacity,
  // since current $11.2M theoretical is unrealizable). Added-GH rows use the
  // theoretical capacity revenue — that's the ceiling we can chase once capacity
  // is in place, and incremental ROI compares to the realistic starting point.
  const annualRevAt = (A, n) => n === 0
    ? (_box1AnnualRev + _box4AnnualRev[0]) / 2
    : _box4AnnualRev[n];

  const costPerAc = _settings.cucumberCostPerAc || 1000000;
  const fM = v => '$' + (v / 1e6).toFixed(1) + 'M';
  const fK_ = v => (v < 0 ? '-' : '') + Math.round(Math.abs(v) / 1e3).toLocaleString() + 'K';
  const fPct = v => (v * 100).toFixed(0) + '%';

  // Baseline = (Box 1 sales revenue + Box 2 extended-capacity revenue) / 2.
  // Reflects imperfect sales elasticity — we can't immediately sell 100% of
  // new supply, so we anchor the return comparison halfway between today's
  // actual sales and the theoretical capacity-limited ceiling.
  const baseline = (_box1AnnualRev + _box2AnnualRev) / 2;

  let html = '';
  html += `<div style="margin-bottom:10px;font-size:11px;color:var(--text-sub)">
    Baseline = (Box 1 sales <b>${fM(_box1AnnualRev)}</b>
    + Box 2 extended <b>${fM(_box2AnnualRev)}</b>) / 2
    = <b>${fM(baseline)}</b>
  </div>`;
  html += '<div style="overflow-x:auto"><table class="fin-table">' +
    '<thead><tr>' +
    '<th>Total ac</th>' +
    '<th>Annual revenue</th>' +
    '<th>Cum. capex (new)</th>' +
    '<th>Cum. rev vs baseline</th>' +
    '<th>Δ rev vs prev</th>' +
    '<th>Cum. OpInc ROI / yr</th>' +
    '</tr></thead><tbody>';

  const OP_INC_MARGIN = 0.30;
  let prevRev = null;
  let finalRev = null;
  let finalCapex = 0;
  for (let idx = 0; idx < acreLevels.length; idx++) {
    const A = acreLevels[idx];
    const rev = annualRevAt(A, idx);
    const capex = Math.max(0, A - existingTotal) * costPerAc;
    const cumAddRev = idx === 0 ? 0 : rev - baseline;
    const cumOpInc = cumAddRev * OP_INC_MARGIN;
    const cumRoi = capex > 0 ? cumOpInc / capex : null;
    const deltaRev = prevRev == null ? null : rev - prevRev;
    const nGH = idx;  // 0 = baseline
    const label = nGH === 0
      ? `${A.toFixed(1)} (baseline)`
      : `${A.toFixed(1)} (+${nGH} GH)`;
    html += `<tr>
      <td>${label}</td>
      <td>${fM(rev)}</td>
      <td>${fM(capex)}</td>
      <td>${fK_(cumAddRev)}</td>
      <td>${deltaRev == null ? '—' : fK_(deltaRev)}</td>
      <td>${capex > 0 ? fPct(cumRoi) : '—'}</td>
    </tr>`;
    prevRev = rev;
    finalRev = rev;
    finalCapex = capex;
  }
  html += '</tbody></table></div>';

  document.getElementById('roiBody').innerHTML = html;
  document.getElementById('roiPanel').style.display = '';
}
