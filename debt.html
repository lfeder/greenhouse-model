<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="header-title">Debt & PE/DD Schedule</div>
    <div style="display:flex;align-items:baseline;gap:14px">
      <div style="display:flex;gap:12px;font-size:10px" id="nav"></div>
      <div style="font-size:10px">v {{VERSION}}</div>
      <button onclick="toggleTheme()" class="btn" id="themeToggle">light</button>
    </div>
  </div>
</div>
<script src="utils.js"></script>
<script>document.getElementById('nav').innerHTML = buildNav('debt.html'); initTheme();</script>
<div style="max-width:1200px;margin:0 auto;padding:20px 32px">
  <div class="panel">
    <div class="panel-title">Existing Loans ($M)</div>
    <div style="overflow-x:auto"><table class="fin-table" id="existLoansTable"></table></div>
  </div>
  <div class="panel">
    <div class="panel-title">Expansion Loans ($M)</div>
    <div style="overflow-x:auto"><table class="fin-table" id="expansionLoansTable"></table></div>
  </div>
  <div class="panel">
    <div class="panel-title">PE/DD Detail ($M)</div>
    <div style="overflow-x:auto"><table class="fin-table" id="peddTable"></table></div>
  </div>
</div>
<script>
// Table helpers loaded from utils.js

async function load() {
  const [r, sr_] = await Promise.all([
    fetch('/api/compute', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}),
    fetch('/api/settings'),
  ]);
  const d = await r.json();
  const settings = await sr_.json();
  d.settings = settings;
  const Y = d.years;

  // Existing loans
  let el = `<thead><tr><th></th>${yh(Y)}</tr></thead><tbody>`;
  if (d.loan_data) {
    for (const [name, sched] of Object.entries(d.loan_data)) {
      el += sr(name, Y);
      el += tr('Interest', sched.map(s => -s.interest));
      el += tr('Principal', sched.map(s => -s.principal));
      el += tr('Balance', sched.map(s => s.end_bal));
    }
  }
  // Existing balance per year (sum of end_bal across all existing loans)
  const existBal = Y.map((_, i) => {
    let b = 0;
    if (d.loan_data) for (const sched of Object.values(d.loan_data)) b += sched[i].end_bal || 0;
    return b;
  });
  el += sr('Totals', Y);
  el += tr('Total Interest', d.loan_total_int.map(v => -v));
  el += tr('Total Principal', d.loan_total_prin.map(v => -v));
  el += tr('Total Balance', existBal);
  el += tr('Total DS', d.loan_total_ds.map(v => -v), fCM, 'subtotal-row');
  el += '</tbody>';
  document.getElementById('existLoansTable').innerHTML = el;

  // Expansion loan — single consolidated loan from chosen lender (SBA or JJB).
  // Excludes Tomato (Buy) — that's a separate hard-asset acquisition loan.
  let xl = `<thead><tr><th></th>${yh(Y)}</tr></thead><tbody>`;
  if (d.expansion_loan_detail) {
    const totalAmt = d.bank_total || 0;
    const rate = settings.bankRate || 7;
    const term = settings.bankTerm || 25;
    const balance = Y.map(() => 0);
    for (const [name, det] of Object.entries(d.expansion_loan_detail)) {
      if (!det || name.includes('(Buy)')) continue;
      for (let i = 0; i < Y.length; i++) balance[i] += det.balance[i] || 0;
    }
    const lender = settings.expansionLender || 'Expansion';
    xl += sr(lender + ' Loan (' + fCM(totalAmt) + 'M @ ' + rate.toFixed(0) + '%, ' + term + 'yr)', Y);
    xl += tr('Interest', d.expansion_int.map(v => -v));
    xl += tr('Principal', d.expansion_prin.map(v => -v));
    xl += tr('Balance', balance);
  }
  // Combined totals: existing + expansion (sans T_BUY, already excluded above)
  const expBal = Y.map(() => 0);
  if (d.expansion_loan_detail) {
    for (const [name, det] of Object.entries(d.expansion_loan_detail)) {
      if (!det || name.includes('(Buy)')) continue;
      for (let i = 0; i < Y.length; i++) expBal[i] += det.balance[i] || 0;
    }
  }
  const totInt  = Y.map((_, i) => d.loan_total_int[i] + d.expansion_int[i]);
  const totPrin = Y.map((_, i) => d.loan_total_prin[i] + d.expansion_prin[i]);
  const totDS   = Y.map((_, i) => d.loan_total_ds[i] + d.expansion_ds[i]);
  const totBal  = Y.map((_, i) => existBal[i] + expBal[i]);
  xl += sr('Totals (Existing + Expansion)', Y);
  xl += tr('Total Interest', totInt.map(v => -v));
  xl += tr('Total Principal', totPrin.map(v => -v));
  xl += tr('Total Balance', totBal);
  xl += tr('Total DS', totDS.map(v => -v), fCM, 'subtotal-row');
  xl += '</tbody>';
  document.getElementById('expansionLoansTable').innerHTML = xl;

  // PE/DD
  let pd = `<thead><tr><th></th>${yh(Y)}</tr></thead><tbody>`;
  if (d.detail) {
    for (const [name, det] of Object.entries(d.detail)) {
      if (det.end_bal.some(v => v > 50) || det.prin_paid.some(v => v > 50)) {
        pd += sr(name, Y);
        pd += tr('Prin Paid', det.prin_paid.map(v => -v));
        pd += tr('Int Paid', det.int_paid.map(v => -v));
        pd += tr('Balance', det.end_bal);
        if (det.int_owed.some(v => v > 50)) pd += tr('Int Owed', det.int_owed);
      }
    }
  }
  pd += '</tbody>';
  document.getElementById('peddTable').innerHTML = pd;
}
load();
window.addEventListener('focus', load);
</script>
</body>
</html>
